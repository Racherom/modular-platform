# Cross language tasks. Install Task (https://taskfile.dev), Go 1.26 or newer (go.work pins the
# toolchain it fetches), Node 26 with pnpm 12, and Docker with the Compose plugin.
version: "3"

vars:
  GO_PACKAGES: ./catalog/... ./libs/... ./sdk/... ./services/planner/... ./services/api/... ./services/deployer-docker/...
  IMAGE_PREFIX: ghcr.io/racherom/modular-platform
  IMAGE_TAG: dev
  GOLANGCI_LINT_VERSION: v2.15.0
  LEFTHOOK_VERSION: v2.2.2
  # go run pkg@version builds with the toolchain the tool's module asks for; golangci-lint must be
  # built with at least the toolchain go.work pins, or it refuses the code
  GO_TOOLCHAIN:
    sh: go env GOVERSION
  GOLANGCI_LINT: env GOTOOLCHAIN={{.GO_TOOLCHAIN}} go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
  ONLINE: >-
    docker compose --project-directory deploy/online
    --env-file deploy/online/versions.env --env-file deploy/online/.env

tasks:
  default:
    cmds:
      - task --list

  web:install:
    internal: true
    dir: web
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
    status:
      - test -d node_modules

  generate:
    desc: Generate Go and TypeScript code from contracts/openapi and the sdk getters from catalog entries (the output is committed)
    deps: [web:install]
    cmds:
      - go generate ./libs/contract ./libs/render/... ./libs/target/... ./sdk/... ./services/planner/... ./services/api/... ./services/deployer-docker/...
      - pnpm --dir web run generate

  build:
    desc: Build the Go code, the editor, and the platform images
    cmds:
      - task: build:go
      - task: build:web
      - task: images

  build:go:
    cmds:
      - go build {{.GO_PACKAGES}}

  build:web:
    deps: [web:install]
    cmds:
      - pnpm --dir web run build

  images:
    desc: Build the web, planner, api and deployer-docker images, tagged {{.IMAGE_TAG}}
    cmds:
      - docker build -f services/planner/Dockerfile -t {{.IMAGE_PREFIX}}/planner:{{.IMAGE_TAG}} .
      - docker build -f services/api/Dockerfile -t {{.IMAGE_PREFIX}}/api:{{.IMAGE_TAG}} .
      - docker build -f services/deployer-docker/Dockerfile -t {{.IMAGE_PREFIX}}/deployer-docker:{{.IMAGE_TAG}} .
      - docker build -f web/Dockerfile -t {{.IMAGE_PREFIX}}/web:{{.IMAGE_TAG}} .

  test:
    desc: Run the Go and editor tests
    deps: [web:install]
    cmds:
      - go test -race {{.GO_PACKAGES}}
      - pnpm --dir web test

  test:integration:
    desc: Run the Go tests that need Docker (build tags integration and e2e; they build test images)
    # Two runs: testcontainers shares one session, and one reaper, across every package of a go
    # test run. The e2e test builds images for about 10 seconds before it reaches Docker, and by
    # then the reaper of packages that finished early prunes the session's containers.
    cmds:
      - go test -race -tags integration {{.GO_PACKAGES}}
      - go test -race -tags e2e {{.GO_PACKAGES}}

  lint:
    desc: Lint and check formatting of the Go code (golangci-lint) and the editor (Biome, tsc)
    deps: [web:install]
    cmds:
      - task: lint:go
      - pnpm --dir web run lint
      - pnpm --dir web run typecheck

  lint:go:
    desc: Run golangci-lint on the Go code, formatters included (.golangci.yml)
    cmds:
      - "{{.GOLANGCI_LINT}} run {{.GO_PACKAGES}}"

  fmt:
    desc: Format the Go code (gofumpt, goimports) and the editor (Biome), applying safe fixes
    deps: [web:install]
    cmds:
      - task: fmt:go
      - pnpm --dir web run format

  fmt:go:
    desc: Format the Go code, or only the files after -- (the pre commit hook passes them)
    cmds:
      - "{{.GOLANGCI_LINT}} fmt {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.GO_PACKAGES}}{{end}}"

  hooks:
    desc: Install lefthook {{.LEFTHOOK_VERSION}} into your Go bin directory and the pre commit hook (lefthook.yml)
    cmds:
      - go install github.com/evilmartians/lefthook/v2@{{.LEFTHOOK_VERSION}}
      - gobin="$(go env GOBIN)"; "${gobin:-$(go env GOPATH)/bin}/lefthook" install

  online:env:
    internal: true
    cmds:
      - cp deploy/online/.env.example deploy/online/.env
    status:
      - test -f deploy/online/.env

  online:up:
    desc: Run the online tool from the images in versions.env (MP_VERSION=dev for your own task images)
    deps: [online:env]
    cmds:
      - "{{.ONLINE}} -f deploy/online/compose.yaml up -d --wait --wait-timeout 120"

  online:down:
    desc: Stop the online tool
    cmds:
      - "{{.ONLINE}} -f deploy/online/compose.yaml -f deploy/online/compose.dev.yaml down"

  dev:
    desc: Run the online tool graph with the editor served by the Vite dev server, on https://platform.localhost
    deps: [online:env, web:install]
    env:
      MP_VERSION: dev
      MP_DEV_PROXY: "1"
    cmds:
      - defer: "{{.ONLINE}} -f deploy/online/compose.yaml -f deploy/online/compose.dev.yaml down"
      - "{{.ONLINE}} -f deploy/online/compose.yaml -f deploy/online/compose.dev.yaml up -d --build --wait --wait-timeout 120"
      - pnpm --dir web dev

  dev:managed:
    desc: Run the managed platform on https://platform.localhost with the editor served by the Vite dev server (binds 80 and 443)
    deps: [web:install]
    env:
      MP_DEV_PROXY: "1"
      MP_MODE: managed
      MP_API_ROOT: /api
    cmds:
      - task: dev:managed:install
      - defer: docker compose --project-directory .dev/managed -f .dev/managed/compose.yaml -f .dev/managed/compose.dev.yaml down
      - docker compose --project-directory .dev/managed -f .dev/managed/compose.yaml -f .dev/managed/compose.dev.yaml up -d --build
      - pnpm --dir web dev

  dev:managed:install:
    internal: true
    # once: a copy of deploy/managed outside the tracked folder, so no secret lands in git
    cmds:
      - mkdir -p .dev
      - cp -R deploy/managed .dev/managed
      - |
        password=$(od -An -tx1 -N12 /dev/urandom | tr -d ' \n')
        printf 'platform.localhost\nadmin@platform.localhost\nadmin\n%s\n' "$password" | sh .dev/managed/setup.sh
        echo "Sign in as admin with the password $password (kept nowhere else; delete .dev/managed to start over)."
    status:
      - test -f .dev/managed/.env

  managed:zip:
    desc: Pack deploy/managed into dist/modular-platform-<version>.zip; the same version gives the same bytes
    vars:
      VERSION:
        sh: |
          sed -n 's/.*"\.": "\(.*\)".*/\1/p' .release-please-manifest.json
    cmds:
      - mkdir -p dist
      - python3 scripts/managed_zip.py deploy/managed "modular-platform-{{.VERSION}}" "dist/modular-platform-{{.VERSION}}.zip"

  smoke:managed:
    desc: Install the managed platform with setup.sh, sign in, deploy the sample, see it running, remove it with its data (needs the images tagged ci and Chromium; SMOKE_DOCKER_RESTART=1 also restarts Docker in between)
    deps: [web:install]
    cmds:
      - sh scripts/smoke-managed.sh

  smoke:
    desc: Run the smoke job against freshly built images (needs Chromium for Playwright)
    deps: [web:install]
    cmds:
      - task: images
      - sh scripts/smoke.sh
