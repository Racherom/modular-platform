# Cross language tasks. Install Task (https://taskfile.dev), Go 1.26 or newer (go.work pins the
# toolchain it fetches), Node 26 with pnpm 12, and Docker with the Compose plugin.
version: "3"

vars:
  GO_PACKAGES: ./catalog/... ./libs/... ./sdk/... ./services/renderer/... ./services/api/... ./services/deployer-docker/...
  IMAGE_PREFIX: ghcr.io/racherom/modular-platform
  IMAGE_TAG: dev
  # the commit an image build names as its source (spec 0030); local when the tree has changes,
  # so no image or zip claims a commit its code does not come from (AC-12)
  SOURCE_REF:
    sh: if [ -z "$(git status --porcelain)" ]; then git rev-parse HEAD; else echo local; fi
  GOLANGCI_LINT_VERSION: v2.15.0
  LEFTHOOK_VERSION: v2.2.2
  SKILLS_VERSION: 1.7.6
  # the renovate npm package, for its config validator (spec 0030, AC-13)
  RENOVATE_VERSION: 44.198.3
  # go run pkg@version builds with the toolchain the tool's module asks for; golangci-lint must be
  # built with at least the toolchain go.work pins, or it refuses the code
  GO_TOOLCHAIN:
    sh: go env GOVERSION
  GOLANGCI_LINT: env GOTOOLCHAIN={{.GO_TOOLCHAIN}} go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
  ONLINE: >-
    docker compose --project-directory deploy/online
    --env-file deploy/online/versions.env --env-file deploy/online/.env

tasks:
  default:
    cmds:
      - task --list

  web:install:
    internal: true
    dir: web
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
    status:
      - test -d node_modules

  generate:
    desc: Generate Go and TypeScript code from contracts/openapi and the sdk getters from catalog entries (the output is committed)
    deps: [web:install]
    cmds:
      - go generate ./libs/contract ./libs/render/... ./libs/target/... ./sdk/... ./services/renderer/... ./services/api/... ./services/deployer-docker/...
      - pnpm --dir web run generate

  build:
    desc: Build the Go code, the editor, and the platform images
    cmds:
      - task: build:go
      - task: build:web
      - task: images

  build:go:
    cmds:
      - go build {{.GO_PACKAGES}}

  build:web:
    deps: [web:install]
    cmds:
      - pnpm --dir web run build

  images:
    desc: Build the web, renderer, api and deployer-docker images, tagged {{.IMAGE_TAG}}
    cmds:
      - docker build --build-arg MP_SOURCE_REF={{.SOURCE_REF}} -f catalog/modules/renderer/Dockerfile -t {{.IMAGE_PREFIX}}/renderer:{{.IMAGE_TAG}} .
      - docker build --build-arg MP_SOURCE_REF={{.SOURCE_REF}} -f catalog/modules/api/Dockerfile -t {{.IMAGE_PREFIX}}/api:{{.IMAGE_TAG}} .
      - docker build --build-arg MP_SOURCE_REF={{.SOURCE_REF}} -f catalog/modules/deployer-docker/Dockerfile -t {{.IMAGE_PREFIX}}/deployer-docker:{{.IMAGE_TAG}} .
      - docker build --build-arg MP_SOURCE_REF={{.SOURCE_REF}} -f catalog/modules/web/Dockerfile -t {{.IMAGE_PREFIX}}/web:{{.IMAGE_TAG}} .

  test:
    desc: Run the Go and editor tests
    deps: [web:install]
    cmds:
      - go test -race {{.GO_PACKAGES}}
      - pnpm --dir web test

  test:browser:
    desc: Run the editor's browser check (Playwright and axe against the dev server, renderer mocked; needs Chromium)
    deps: [web:install]
    cmds:
      - pnpm --dir web a11y

  test:integration:
    desc: Run the Go tests that need Docker (build tags integration and e2e; they build test images)
    # Two runs: testcontainers shares one session, and one reaper, across every package of a go
    # test run. The e2e test builds images for about 10 seconds before it reaches Docker, and by
    # then the reaper of packages that finished early prunes the session's containers.
    cmds:
      - go test -race -tags integration {{.GO_PACKAGES}}
      - go test -race -tags e2e {{.GO_PACKAGES}}

  lint:
    desc: Lint and check formatting of the Go code (golangci-lint) and the editor (Biome, tsc), check renovate.json, and check for retired words
    deps: [web:install]
    cmds:
      - task: lint:vocabulary
      - task: lint:go
      - task: lint:renovate
      - pnpm --dir web run lint
      - pnpm --dir web run typecheck

  lint:go:
    desc: Run golangci-lint on the Go code, formatters included (.golangci.yml)
    cmds:
      - "{{.GOLANGCI_LINT}} run {{.GO_PACKAGES}}"

  lint:renovate:
    desc: Check renovate.json with Renovate's own validator; a wrong key would otherwise fail silently
    cmds:
      - pnpm dlx --package renovate@{{.RENOVATE_VERSION}} renovate-config-validator --strict renovate.json

  lint:vocabulary:
    desc: Fail on a retired word (scripts/vocabulary.txt, spec 0027) in a tracked or staged file; report=1 only prints the hits and their count
    cmds:
      - sh scripts/vocabulary.sh{{if .report}} --report{{end}}

  fmt:
    desc: Format the Go code (gofumpt, goimports) and the editor (Biome), applying safe fixes
    deps: [web:install]
    cmds:
      - task: fmt:go
      - pnpm --dir web run format

  fmt:go:
    desc: Format the Go code, or only the files after -- (the pre commit hook passes them)
    cmds:
      - "{{.GOLANGCI_LINT}} fmt {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.GO_PACKAGES}}{{end}}"

  hooks:
    desc: Install lefthook {{.LEFTHOOK_VERSION}} into your Go bin directory and the pre commit hook (lefthook.yml)
    cmds:
      - go install github.com/evilmartians/lefthook/v2@{{.LEFTHOOK_VERSION}}
      - gobin="$(go env GOBIN)"; "${gobin:-$(go env GOPATH)/bin}/lefthook" install

  skills:
    desc: Restore the agent skills in skills-lock.json into .agents/skills and link each into .claude/skills (once per clone; skills {{.SKILLS_VERSION}})
    cmds:
      # experimental_install fills only .agents/skills; Claude Code reads .claude/skills, so link each skill there
      - pnpm dlx skills@{{.SKILLS_VERSION}} experimental_install
      - mkdir -p .claude/skills
      - for dir in .agents/skills/*/; do name="$(basename "$dir")"; [ -e ".claude/skills/$name" ] || [ -L ".claude/skills/$name" ] || ln -s "../../.agents/skills/$name" ".claude/skills/$name"; done

  online:env:
    internal: true
    cmds:
      - cp deploy/online/.env.example deploy/online/.env
    status:
      - test -f deploy/online/.env

  online:up:
    desc: Run the online editor from the images in versions.env (MP_VERSION=dev for your own task images); while MP_VERSION is 0.0.0 it builds them from GitHub at the commit MP_SOURCE_REF points to
    deps: [online:env]
    cmds:
      # 0.0.0 is in no registry: build web and renderer from GitHub instead, at the commit
      # MP_SOURCE_REF resolves to now; the shell value wins over versions.env, which stays as it
      # is (spec 0030, AC-8)
      - |
        version=${MP_VERSION:-$(sed -n 's/^MP_VERSION=\([^ #]*\).*/\1/p' deploy/online/versions.env)}
        if [ "$version" = 0.0.0 ]; then
          MP_SOURCE_REF=$(sh scripts/online-source-ref.sh) || exit 1
          export MP_SOURCE_REF
          echo "online:up: building web and renderer from GitHub at $MP_SOURCE_REF"
          {{.ONLINE}} -f deploy/online/compose.yaml -f deploy/online/compose.prerelease.yaml up -d --build --wait --wait-timeout 120
        else
          {{.ONLINE}} -f deploy/online/compose.yaml up -d --wait --wait-timeout 120
        fi

  online:down:
    desc: Stop the online editor
    cmds:
      - "{{.ONLINE}} -f deploy/online/compose.yaml -f deploy/online/compose.dev.yaml down"

  dev:
    desc: Run the online editor graph with the editor served by the Vite dev server, on https://platform.localhost
    deps: [online:env, web:install]
    env:
      MP_VERSION: dev
      MP_DEV_PROXY: "1"
    cmds:
      - defer: "{{.ONLINE}} -f deploy/online/compose.yaml -f deploy/online/compose.dev.yaml down"
      - "{{.ONLINE}} -f deploy/online/compose.yaml -f deploy/online/compose.dev.yaml up -d --build --wait --wait-timeout 120"
      - pnpm --dir web dev

  dev:managed:
    desc: Run the managed platform on https://platform.localhost with the editor served by the Vite dev server (binds 80 and 443)
    deps: [web:install]
    env:
      MP_DEV_PROXY: "1"
      MP_MODE: managed
      MP_API_ROOT: /api
    vars:
      COMPOSE: docker compose --project-directory .dev/managed -f .dev/managed/docker-compose.yml -f deploy/managed/compose.dev.yaml
    cmds:
      - task: dev:managed:install
      - defer: "{{.COMPOSE}} down"
      - "{{.COMPOSE}} up -d --build"
      - pnpm --dir web dev

  dev:managed:install:
    internal: true
    deps: [{task: managed:render, vars: {MANAGED_IMAGE_TAG: dev}}]
    # the rendered folder copied outside the tracked tree, so no secret lands in git; each run
    # copies a new render over it and keeps .env, secrets/, data/ and stacks/
    cmds:
      - mkdir -p .dev/managed
      - cp -R build/managed/. .dev/managed/
      # setup.sh runs api's caller-key step in the api image, before up builds it
      - docker build -q --build-arg MP_SOURCE_REF={{.SOURCE_REF}} -f catalog/modules/api/Dockerfile -t {{.IMAGE_PREFIX}}/api:dev . >/dev/null
      - |
        if [ -f .dev/managed/.env ] && [ -f .dev/managed/secrets/authelia/users ]; then
          sh .dev/managed/setup.sh </dev/null >/dev/null
        else
          password=$(od -An -tx1 -N12 /dev/urandom | tr -d ' \n')
          # domain, origin (empty: https://<domain>), admin email, admin user name, admin password
          printf 'platform.localhost\n\nadmin@platform.localhost\nadmin\n%s\n' "$password" | sh .dev/managed/setup.sh
          echo "Sign in as admin with the password $password (kept nowhere else; delete .dev/managed to start over)."
        fi

  managed:render:
    desc: Render deploy/managed/graph.yaml with the built in catalog into build/managed, the folder the release zip ships
    vars:
      # empty for a release: every image tag from the catalog; dev and ci for a local or CI run
      MANAGED_IMAGE_TAG: '{{.MANAGED_IMAGE_TAG | default ""}}'
    cmds:
      - go run ./catalog/cmd/render-platform -graph deploy/managed/graph.yaml -out build/managed -source-ref {{.SOURCE_REF}}{{if .MANAGED_IMAGE_TAG}} -image-tag {{.MANAGED_IMAGE_TAG}}{{end}}

  managed:zip:
    desc: Pack the rendered build/managed into dist/modular-platform-<version>.zip; the same version gives the same bytes
    vars:
      VERSION:
        sh: |
          sed -n 's/.*"\.": "\(.*\)".*/\1/p' .release-please-manifest.json
    deps: [managed:render]
    cmds:
      - |
        if [ '{{.VERSION}}' = 0.0.0 ] && [ '{{.SOURCE_REF}}' = local ]; then
          echo "managed:zip: the tree has uncommitted changes, so this zip builds only with MP_SOURCE_PATH; commit first for a zip that builds from GitHub" >&2
        fi
      - mkdir -p dist
      - python3 scripts/managed_zip.py build/managed "modular-platform-{{.VERSION}}" "dist/modular-platform-{{.VERSION}}.zip"

  smoke:managed:
    desc: Install the managed platform with setup.sh, sign in, deploy the sample, see it running, remove it with its data (needs the images tagged ci and Chromium; SMOKE_DOCKER_RESTART=1 also restarts Docker in between)
    deps: [web:install, {task: managed:render, vars: {MANAGED_IMAGE_TAG: ci}}]
    cmds:
      - sh scripts/smoke-managed.sh

  smoke:
    desc: Run the smoke job against freshly built images (needs Chromium for Playwright)
    deps: [web:install]
    cmds:
      - task: images
      - sh scripts/smoke.sh
