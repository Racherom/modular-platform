name: Release images

# Pushes the four platform images for the version the release-please pull request names, while
# that pull request is still open (spec 0030, AC-9). The merge then flips the catalog tags, the
# managed zip and versions.env to images that already exist, so main never names a missing one.
# Mark "Release images to GHCR" as a required check on main. That name belongs to the gate job
# below, not to the matrix: a matrix reports one check per image ("Release image (renderer)"),
# so a required check on the matrix name would never report on the release pull request and
# would block its merge. The gate passes when every image was pushed, or when the push was
# skipped because the pull request is not the release one.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # a newer push to the pull request cancels a stale image push
  group: release-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  images:
    name: Release image
    # the release-please branch of this repository only, never a fork
    if: startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [renderer, web, api, deployer-docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: version
        name: The version the pull request releases
        run: echo "version=$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: catalog/modules/${{ matrix.service }}/Dockerfile
          build-args: |
            MP_SOURCE=local
            MP_SOURCE_REF=${{ github.event.pull_request.head.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/racherom/modular-platform/${{ matrix.service }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/racherom/modular-platform
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  gate:
    name: Release images to GHCR
    # the required check: runs on every pull request, even when the push was skipped
    needs: images
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every image was pushed, or the pull request is not the release one
        env:
          RESULT: ${{ needs.images.result }}
        run: |
          case "$RESULT" in
            success | skipped) ;;
            *) echo "::error::the release images were not all pushed (result: $RESULT)"; exit 1 ;;
          esac
