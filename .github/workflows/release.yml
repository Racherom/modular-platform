name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # a pull request opened with the default token starts no CI; see README, Releases
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  managed-zip:
    name: Managed zip on the release
    # the images were pushed from the release pull request (release-images.yml, spec 0030);
    # the check below fails the job rather than ship a zip that names a missing image
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Every platform image of the release is in GHCR for amd64 and arm64
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for service in renderer web api deployer-docker; do
            image="ghcr.io/racherom/modular-platform/$service:$VERSION"
            manifest=$(docker buildx imagetools inspect "$image") || {
              echo "::error::$image is not in GHCR; did the release pull request push it?"
              exit 1
            }
            for platform in linux/amd64 linux/arm64; do
              printf '%s\n' "$manifest" | grep -Eq "Platform: +$platform\$" || {
                echo "::error::$image has no $platform image"
                exit 1
              }
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      # release-please already wrote the version into the platform's catalog entries and the
      # manifest, so the render pins the images this release pushed (spec 0015)
      - run: task managed:zip VERSION="${{ needs.release-please.outputs.version }}"
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" "dist/modular-platform-${{ needs.release-please.outputs.version }}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
