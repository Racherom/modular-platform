name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    # off until a release is near: set the repository variable RELEASES_ENABLED to true
    # after the secret RELEASE_PLEASE_TOKEN (README, Releases; spec 0030, AC-11). A job's
    # `if` can read vars but not secrets, so the variable gates and the step below checks.
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # the token carries the rights to push the branch and open the pull request
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release token is set
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: '[ -n "$TOKEN" ] || { echo "::error::RELEASE_PLEASE_TOKEN is not set; set it before RELEASES_ENABLED (README, Releases)"; exit 1; }'
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # never github.token: Actions may not open or approve pull requests here, and a
          # pull request opened with it starts no CI; see README, Releases
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: Release image
    # built from the release commit right after the merge, so an image holds exactly the code of
    # the release that names it (spec 0030, AC-9). Until this job ends, main names images that
    # are still being pushed. If one image fails, use "Re-run failed jobs": the images already
    # pushed fail their own GHCR check, so a full rerun is not the way to finish a release.
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      # one failed image must not cancel the push of the others
      fail-fast: false
      matrix:
        service: [renderer, web, api, deployer-docker]
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # github.sha is the release commit; a rerun days later still builds that same commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # a released image is never pushed again: the script passes only on "not found" and stops
      # when the tag exists or on any other answer (network, auth), so an unknown state never
      # leads to a push
      - name: The image is not in GHCR yet
        env:
          SERVICE: ${{ matrix.service }}
        run: sh scripts/release-image-absent.sh "ghcr.io/racherom/modular-platform/$SERVICE:$VERSION"
      # the last step, so nothing can fail after a successful push
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: catalog/modules/${{ matrix.service }}/Dockerfile
          build-args: |
            MP_SOURCE=local
            MP_SOURCE_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/racherom/modular-platform/${{ matrix.service }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/racherom/modular-platform
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  managed-zip:
    name: Managed zip on the release
    # runs only once all four images are pushed (the images job above, spec 0030); the check
    # below still fails the job rather than ship a zip that names a missing image
    needs: [release-please, images]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the checkout comes first so the job can run the check script
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every platform image of the release is in GHCR for amd64 and arm64
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/release-images-check.sh "$VERSION"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      # release-please already wrote the version into the platform's catalog entries and the
      # manifest, so the render pins the images this release pushed (spec 0015)
      - run: task managed:zip VERSION="$VERSION"
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
      - run: gh release upload "$TAG" "dist/modular-platform-$VERSION.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
