name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # a pull request opened with the default token starts no CI; see README, Releases
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: Images to GHCR
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: planner
            dockerfile: services/planner/Dockerfile
          - service: web
            dockerfile: web/Dockerfile
          - service: api
            dockerfile: services/api/Dockerfile
          - service: deployer-docker
            dockerfile: services/deployer-docker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/racherom/modular-platform/${{ matrix.service }}:${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/racherom/modular-platform
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  managed-zip:
    name: Managed zip on the release
    # after the images, so the zip never names a tag that is not pushed yet
    needs: [release-please, images]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      # release-please already wrote the version into the platform's catalog entries and the
      # manifest, so the render pins the images this release pushed (spec 0015)
      - run: task managed:zip VERSION="${{ needs.release-please.outputs.version }}"
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" "dist/modular-platform-${{ needs.release-please.outputs.version }}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
