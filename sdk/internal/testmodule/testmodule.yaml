apiVersion: modular-platform/v1
kind: Module
name: testmodule
description: Declares one value of every type and one slot field of every type, for the sdk's own tests.
image: example.test/testmodule:1.0.0
runtime: sdk
provides:
  greet:
    capability: greet
    version: "1.0"
    auth: binding-token
    fields:
      url: {platform: url}
      token: {generate: true}
    env:
      token: TM_CLIENTS_DIR
uses:
  echo:
    capability: echo
    optional: true
    client: http
    env:
      url: TM_ECHO_URL
      token: TM_ECHO_TOKEN_FILE
  postgresql:
    capability: postgresql
    optional: true
    client: postgresql
    env:
      url: TM_DB_URL
      database: TM_DB_NAME
      user: TM_DB_USER
      password: TM_DB_PASSWORD_FILE
      sslmode: TM_DB_SSLMODE
      ca: TM_DB_CA_FILE
  realm:
    capability: realm
    optional: true
    env:
      name: TM_REALM_NAME
      port: TM_REALM_PORT
      secure: TM_REALM_SECURE
      issuer: TM_REALM_ISSUER
      mode: TM_REALM_MODE
      key: TM_REALM_KEY_FILE
      ca: TM_REALM_CA_FILE
      hint: TM_REALM_HINT
      retries: TM_REALM_RETRIES
      strict: TM_REALM_STRICT
      home: TM_REALM_HOME
      tier: TM_REALM_TIER
      pin: TM_REALM_PIN_FILE
      roots: TM_REALM_ROOTS_FILE
  storage:
    capability: s3
    optional: true
    client: s3
    env:
      url: TM_STORE_URL
      bucket: TM_STORE_BUCKET
      region: TM_STORE_REGION
      access_key_id: TM_STORE_ACCESS_KEY_ID
      secret_access_key: TM_STORE_SECRET_KEY_FILE
      ca: TM_STORE_CA_FILE
config:
  api-key:
    env: TM_API_KEY
    type: secret
    description: The key the module signs with.
  count:
    env: TM_COUNT
    type: int
    default: "5"
    min: 1
    max: 100
    description: The number of items to keep.
  greeting:
    env: TM_GREETING
    type: string
    default: hello
    pattern: "[a-z]+"
    description: The word the module answers with.
  level:
    env: TM_LEVEL
    type: enum
    values: [low, high]
    default: low
    description: The amount the module logs.
  note:
    env: TM_NOTE
    type: string
    optional: true
    description: Free text, unset by default.
  timeout:
    env: TM_TIMEOUT
    type: duration
    default: 10s
    min: 1s
    description: The longest wait for one call.
  upstream:
    env: TM_UPSTREAM
    type: url
    default: http://upstream.test:8080
    description: The address the module forwards to.
  verbose:
    env: TM_VERBOSE
    type: bool
    default: "false"
    description: Whether each call is logged.
