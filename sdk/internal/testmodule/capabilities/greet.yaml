apiVersion: modular-platform/v1
kind: Capability
name: greet
description: A test REST service that checks a token per binding.
fields:
  url: {type: url, description: Base URL.}
  token: {type: secret, direction: both, description: Binding token.}
  ca: {type: certificate, optional: true, description: Root CA.}
  caller_key: {type: certificate, direction: to_provider, optional: true, description: Public key that signs the consumer's MP-Caller tokens.}
