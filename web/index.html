<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mp-base-path" content="{{env `MP_BASE_PATH`}}" />
    <meta name="mp-api-root" content="{{env `MP_API_ROOT`}}" />
    <meta name="mp-mode" content="{{env `MP_MODE`}}" />
    <meta name="mp-signed-out" content="{{env `MP_SIGNED_OUT`}}" />
    <title>Modular Platform</title>
    <script src="{{env `MP_BASE_PATH`}}/theme.js"></script>
    <!-- React Aria injects a <style> for pressable elements unless an element with this id exists; the content policy blocks injected styles, so its rule lives in src/styles/base.css -->
    <meta id="react-aria-pressable-style" name="react-aria-pressable-style" content="src/styles/base.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
