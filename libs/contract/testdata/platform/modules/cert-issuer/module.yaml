apiVersion: modular-platform/v1
kind: Module
name: cert-issuer
description: The platform's certificate authority, step-ca; ACME for sdk modules and a jobs provisioner for unchanged providers.
image: smallstep/step-ca:0.30.2
command: ["--acme-tls-port=8443", "/home/step/config/ca.json"]
provides:
  acme:
    capability: acme
    version: "1.0"
    port: 9000
    fields:
      url: {platform: url, path: /acme/acme/directory}
      ca: {secret: root-ca}
  certs:
    capability: tls-certificate-provisioner
    version: "1.0"
    port: 9000
    fields:
      url: {platform: url}
      provisioner: {value: jobs}
      password: {secret: jobs-password}
      ca: {secret: root-ca}
secrets:
  - {name: password, from: setup, mount: /home/step/secrets/password, description: Password of the CA keys.}
  - {name: root-ca, from: setup, mount: /home/step/certs/root_ca.crt, description: Root certificate.}
  - {name: root-ca-key, from: setup, mount: /home/step/secrets/root_ca_key, description: Root key.}
  - {name: intermediate-ca, from: setup, mount: /home/step/certs/intermediate_ca.crt, description: Intermediate certificate.}
  - {name: intermediate-ca-key, from: setup, mount: /home/step/secrets/intermediate_ca_key, description: Intermediate key.}
  - {name: jobs-password, from: setup, mount: /home/step/secrets/jobs-password, description: Password of the jobs provisioner.}
  - {name: ca-json, from: setup, mount: /home/step/config/ca.json, description: "The whole ca.json, with both provisioners."}
setup:
  - name: ca
    entrypoint: [sh, -c]
    command: ["step ca init --deployment-type standalone --name modular-platform --dns cert-issuer.$MP_GRAPH.internal --address :9000 --provisioner admin --password-file /out/password ..."]
    env: {STEPPATH: /tmp/step}
    writes:
      - {name: password}
      - {name: root-ca, mode: "0644"}
      - {name: root-ca-key}
      - {name: intermediate-ca, mode: "0644"}
      - {name: intermediate-ca-key}
  - name: config
    entrypoint: [sh, -c]
    command: ["write ca.json with the acme and jobs provisioners and the name policy *.$MP_GRAPH.internal"]
    env: {STEPPATH: /tmp/step}
    reads: [{secret: root-ca}, {secret: intermediate-ca}]
    writes:
      - {name: jobs-password}
      - {name: ca-json}
volumes:
  db: /home/step/db
hardening:
  cap_add: [NET_BIND_SERVICE]
  tmpfs: [/tmp]
