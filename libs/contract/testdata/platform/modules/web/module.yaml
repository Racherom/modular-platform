apiVersion: modular-platform/v1
kind: Module
name: web
description: The editor, served by a Caddy based image.
image: ghcr.io/racherom/modular-platform/web:0.0.0
provides:
  site:
    capability: http
    version: "1.0"
    port: 8080
    fields:
      host: {platform: host}
      port: {platform: port}
      url: {platform: url}
uses:
  public:
    capability: http-ingress
    fields:
      route: {value: /}
      upstream: {platform: url, provide: site}
environment:
  MP_MODE: managed
  MP_BASE_PATH: "{public.base_path}"
  MP_API_ROOT: "{public.base_path}/api"
config:
  signed-out:
    env: MP_SIGNED_OUT
    type: enum
    values: [index, sign-in]
    default: index
    description: What a signed out visitor sees first.
hardening:
  cap_add: [NET_BIND_SERVICE]
  tmpfs: [/tmp]
