apiVersion: modular-platform/v1
kind: Module
name: caddy
description: The platform's ingress, Caddy; serves each route a backend binding asks for, with TLS.
image: caddy:2.11.7-alpine
provides:
  public:
    capability: http-ingress
    version: "1.0"
    port: 443
    fields:
      origin: {config: origin}
      base_path: {config: base-path}
      domain: {config: domain}
      http_port: {config: http-port}
      https_port: {config: https-port}
      ca: {volume: data, path: caddy/pki/authorities/local/root.crt}
uses:
  trust:
    capability: acme
    files:
      ca: /etc/caddy/trust/root.crt
config:
  domain:
    env: INGRESS_DOMAIN
    type: string
    pattern: "[a-z0-9-]+(\\.[a-z0-9-]+)+"
    setup: ask
    description: The domain the platform answers on, with at least one dot.
  origin:
    env: INGRESS_ORIGIN
    type: string
    pattern: "https?://.+"
    default: "https://{domain}"
    setup: ask
    description: Scheme, host and port the browser sees.
  base-path:
    env: INGRESS_BASE_PATH
    type: string
    optional: true
    pattern: "(/[A-Za-z0-9._~-]+)+"
    description: Path the platform is served under; unset at the site root.
  http-port:
    env: INGRESS_HTTP_PORT
    type: int
    default: "80"
    min: 1
    max: 65535
    description: Host port for HTTP.
  https-port:
    env: INGRESS_HTTPS_PORT
    type: int
    default: "443"
    min: 1
    max: 65535
    description: Host port for HTTPS.
  tls-mode:
    env: MP_TLS_MODE
    type: enum
    values: [internal, acme]
    default: internal
    description: Where the public certificate comes from, Caddy's own authority or ACME.
  acme-email:
    env: MP_ACME_EMAIL
    type: string
    optional: true
    description: Contact email for the ACME account.
  web-upstream:
    env: MP_WEB_UPSTREAM
    type: url
    optional: true
    description: Upstream for the site root instead of the web module, like the Vite dev server.
templates:
  - file: Caddyfile.tmpl
    path: /etc/caddy/Caddyfile
volumes:
  data: /data
  config: /config
publish:
  - port: 443
    host: {config: https-port}
  - port: 80
    host: {config: http-port}
network:
  egress: true
  aliases: [{config: domain}]
hardening:
  cap_add: [NET_BIND_SERVICE]
  tmpfs: [/tmp]
