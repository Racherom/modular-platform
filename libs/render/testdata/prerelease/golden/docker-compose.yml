configs:
  postgres_pg_hba.conf:
    file: ./config/postgres/pg_hba.conf
  postgres_postgresql.conf:
    file: ./config/postgres/postgresql.conf
  renderer-2_env:
    file: ./config/renderer-2.env
  renderer_env:
    file: ./config/renderer.env
name: prerelease
networks:
  internal:
    internal: true
secrets:
  postgres_admin_server_admin_password:
    file: ./secrets/postgres/password
  postgres_password:
    file: ./secrets/postgres/password
services:
  mp_jobs:
    cap_drop:
    - ALL
    depends_on:
      postgres_revoke_server:
        condition: service_completed_successfully
        required: true
    entrypoint:
    - sleep
    - infinity
    image: postgres:18.6
    init: true
    network_mode: none
    read_only: true
    security_opt:
    - no-new-privileges:true
    user: ${MP_UID}:${MP_GID}
  postgres:
    cap_drop:
    - ALL
    command:
    - postgres
    - -c
    - config_file=/etc/postgresql/postgresql.conf
    configs:
    - source: postgres_postgresql.conf
      target: /etc/postgresql/postgresql.conf
    - source: postgres_pg_hba.conf
      target: /etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 30s
      test:
      - CMD
      - pg_isready
      - -h
      - 127.0.0.1
      - -U
      - postgres
      timeout: 3s
    image: postgres:18.6-alpine3.24
    networks:
      internal:
        aliases:
        - postgres.prerelease.internal
    read_only: true
    secrets:
    - source: postgres_password
      target: /run/secrets/postgres_password
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /var/run/postgresql
    - /tmp
    user: ${MP_UID}:${MP_GID}
    volumes:
    - source: ./data/postgres/data
      target: /var/lib/postgresql
      type: bind
  postgres_revoke_server:
    cap_drop:
    - ALL
    command:
    - |
      PGPASSWORD=$$(cat "$$MP_ADMIN_ADMIN_PASSWORD_FILE")
      export PGPASSWORD PGHOST="$$MP_ADMIN_HOST" PGPORT="$$MP_ADMIN_PORT" PGUSER="$$MP_ADMIN_ADMIN_USER"
      export PGDATABASE=postgres PGSSLMODE="$$MP_ADMIN_SSLMODE" PGCONNECT_TIMEOUT=10 PGAPPNAME=mp-revoke
      if [ -n "$${MP_ADMIN_CA_FILE:-}" ]; then export PGSSLROOTCERT="$$MP_ADMIN_CA_FILE"; fi
      echo "revoke: logins made by the platform that no binding keeps lose sign in"
      psql -X -q -v ON_ERROR_STOP=1 -v marker="$$MP_MARKER" -v keep="$$MP_KEEP" <<'SQL'
      SELECT pg_advisory_lock(hashtext('modular-platform provisioner')) \g /dev/null
      SELECT format('ALTER ROLE %I NOLOGIN', r.rolname)
        FROM pg_roles r JOIN pg_auth_members m ON m.member = r.oid JOIN pg_roles g ON g.oid = m.roleid
        WHERE g.rolname = :'marker' AND r.rolcanlogin
          AND NOT r.rolname = ANY (string_to_array(:'keep', ',')) \gexec
      SELECT pg_terminate_backend(a.pid)
        FROM pg_stat_activity a JOIN pg_roles r ON r.oid = a.usesysid
        JOIN pg_auth_members m ON m.member = r.oid JOIN pg_roles g ON g.oid = m.roleid
        WHERE g.rolname = :'marker' AND NOT r.rolcanlogin \g /dev/null
      SQL
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    entrypoint:
    - /bin/sh
    - -eu
    - -c
    environment:
      MP_ADMIN_ADMIN_PASSWORD_FILE: /run/secrets/admin/admin_password
      MP_ADMIN_ADMIN_USER: postgres
      MP_ADMIN_HOST: postgres.prerelease.internal
      MP_ADMIN_PORT: "5432"
      MP_ADMIN_SSLMODE: disable
      MP_ADMIN_URL: postgres://postgres.prerelease.internal:5432
      MP_KEEP: ""
      MP_MARKER: mp_provisioned_43076d12
    image: postgres:18.6
    networks:
      internal: {}
    read_only: true
    restart: "no"
    secrets:
    - source: postgres_admin_server_admin_password
      target: /run/secrets/admin/admin_password
    security_opt:
    - no-new-privileges:true
    user: ${MP_UID}:${MP_GID}
  renderer:
    cap_drop:
    - ALL
    configs:
    - source: renderer_env
      target: /etc/modular-platform/module.env
    environment:
      MP_DOMAIN: prerelease.internal
      MP_ENV_FILE: /etc/modular-platform/module.env
      MP_INSTANCE: renderer
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 30s
      test:
      - CMD
      - /renderer
      - healthcheck
      timeout: 3s
    image: ghcr.io/racherom/modular-platform/renderer:0.0.0
    networks:
      internal:
        aliases:
        - renderer.prerelease.internal
    read_only: true
    security_opt:
    - no-new-privileges:true
    user: ${MP_UID}:${MP_GID}
  renderer-2:
    cap_drop:
    - ALL
    configs:
    - source: renderer-2_env
      target: /etc/modular-platform/module.env
    environment:
      MP_DOMAIN: prerelease.internal
      MP_ENV_FILE: /etc/modular-platform/module.env
      MP_INSTANCE: renderer-2
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 30s
      test:
      - CMD
      - /renderer
      - healthcheck
      timeout: 3s
    image: ghcr.io/racherom/modular-platform/renderer:0.0.0
    networks:
      internal:
        aliases:
        - renderer-2.prerelease.internal
    read_only: true
    security_opt:
    - no-new-privileges:true
    user: ${MP_UID}:${MP_GID}
