apiVersion: modular-platform/v1
kind: Module
name: gate
description: A gate not built on the SDK, whose values reach it as Compose variables only, for the .env check of setup.sh.
image: traefik/whoami:v1.11.0
config:
  tls-mode:
    env: GATE_TLS_MODE
    type: enum
    values: [internal, acme]
    default: internal
    description: Where the gate gets its certificates from.
  port:
    env: GATE_PORT
    type: int
    min: 1
    max: 65535
    default: "8080"
    description: Port the gate listens on.
  note:
    env: GATE_NOTE
    type: string
    optional: true
    description: A note the gate shows, none when empty.
  banner:
    env: GATE_BANNER
    type: string
    default: "pay $5 # now"
    description: The banner the gate shows.
