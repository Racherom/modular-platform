name: mp-whoami-postgres
secrets:
  postgres_password:
    file: ./secrets/postgres/password
services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - pg_isready
      - -h
      - 127.0.0.1
      - -U
      - postgres
      timeout: 3s
    image: postgres:18.6
    labels:
      io.github.racherom.modular-platform.deployment: 01960000-0000-7000-8000-000000000001
      io.github.racherom.modular-platform.graph: whoami-postgres
      io.github.racherom.modular-platform.instance: postgres
      io.github.racherom.modular-platform.module: postgres
    restart: unless-stopped
    secrets:
    - source: postgres_password
  whoami:
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      DEMO_POSTGRESQL_HOST: postgres
      DEMO_POSTGRESQL_PORT: "5432"
    image: traefik/whoami:v1.12.0
    labels:
      io.github.racherom.modular-platform.deployment: 01960000-0000-7000-8000-000000000001
      io.github.racherom.modular-platform.graph: whoami-postgres
      io.github.racherom.modular-platform.instance: whoami
      io.github.racherom.modular-platform.module: whoami
    restart: unless-stopped
