apiVersion: modular-platform/v0alpha1
kind: Module
name: pair-provider
description: Greets each consumer by its instance name, for the sdk end to end test.
image: modular-platform/pair-provider:test
runtime: sdk
healthcheck:
  test: ["CMD", "/pair-provider", "healthcheck"]
  interval: 1s
  timeout: 3s
  retries: 30
  start_period: 30s
provides:
  greet:
    auth: binding-token
    env:
      clients_dir: PAIR_CLIENTS_DIR
config:
  greeting:
    env: PAIR_GREETING
    type: string
    pattern: "[a-z]+"
    description: The word the provider greets with.
  signing-key:
    env: PAIR_SIGNING_KEY
    type: secret
    generate: true
    description: A generated secret the provider reads at start, to prove its file is readable.
