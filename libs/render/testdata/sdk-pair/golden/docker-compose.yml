configs:
  consumer_env:
    file: ./config/consumer.env
  provider_env:
    file: ./config/provider.env
name: sdk-pair
networks:
  internal:
    internal: true
secrets:
  consumer_uses_greet_token:
    file: ./secrets/consumer/uses_greet_token
  provider_signing-key:
    file: ./secrets/provider/signing-key
services:
  consumer:
    cap_drop:
    - ALL
    configs:
    - source: consumer_env
      target: /etc/modular-platform/module.env
    depends_on:
      provider:
        condition: service_healthy
        required: true
    environment:
      MP_DOMAIN: sdk-pair.internal
      MP_ENV_FILE: /etc/modular-platform/module.env
      MP_INSTANCE: consumer
      PAIR_GREET_TOKEN_FILE: /run/secrets/uses/greet/token
      PAIR_GREET_URL: http://provider.sdk-pair.internal:8080
    healthcheck:
      interval: 1s
      retries: 30
      start_period: 30s
      test:
      - CMD
      - /pair-consumer
      - healthcheck
      timeout: 3s
    image: modular-platform/pair-consumer:test
    networks:
      internal:
        aliases:
        - consumer.sdk-pair.internal
    read_only: true
    secrets:
    - source: consumer_uses_greet_token
      target: /run/secrets/uses/greet/token
    security_opt:
    - no-new-privileges:true
    user: ${MP_UID}:${MP_GID}
  provider:
    cap_drop:
    - ALL
    configs:
    - source: provider_env
      target: /etc/modular-platform/module.env
    environment:
      MP_DOMAIN: sdk-pair.internal
      MP_ENV_FILE: /etc/modular-platform/module.env
      MP_INSTANCE: provider
      PAIR_CLIENTS_DIR: /run/secrets/clients/greet/token
      PAIR_SIGNING_KEY_FILE: /run/secrets/provider_signing-key
    healthcheck:
      interval: 1s
      retries: 30
      start_period: 30s
      test:
      - CMD
      - /pair-provider
      - healthcheck
      timeout: 3s
    image: modular-platform/pair-provider:test
    networks:
      internal:
        aliases:
        - provider.sdk-pair.internal
    read_only: true
    secrets:
    - source: provider_signing-key
      target: /run/secrets/provider_signing-key
    - source: consumer_uses_greet_token
      target: /run/secrets/clients/greet/token/consumer
    security_opt:
    - no-new-privileges:true
    user: ${MP_UID}:${MP_GID}
