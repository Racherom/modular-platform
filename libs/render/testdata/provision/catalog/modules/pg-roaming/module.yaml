apiVersion: modular-platform/v1
kind: Module
name: pg-roaming
description: Signs in to whatever postgresql it is bound to, made for it or external, for the end to end tests; declares no egress, since a binding to an external server joins it by itself.
image: postgres:18.6
entrypoint: ["sh", "-c"]
command: ["exec sleep infinity"]
uses:
  db:
    capability: postgresql
    env:
      host: DB_HOST
      port: DB_PORT
      database: DB_NAME
      user: DB_USER
      password: DB_PASSWORD_FILE
      sslmode: DB_SSLMODE
# healthy only once it signs in, so up --wait proves the binding works
healthcheck:
  test: ["CMD-SHELL", "PGPASSWORD=$(cat \"$DB_PASSWORD_FILE\") PGSSLMODE=$DB_SSLMODE psql -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\" -d \"$DB_NAME\" -tAc 'select 1'"]
  interval: 2s
  timeout: 5s
  retries: 30
