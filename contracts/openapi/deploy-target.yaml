openapi: 3.1.0
info:
  title: Modular Platform deploy target
  version: 0.1.0
  summary: Applies a rendered stack to one host and reports its state.
  description: |
    The deploy target holds the host's container engine, so it does as little as possible: it
    takes a rendered stack from `api`, checks it again, writes it into the stack's folder,
    creates missing secrets and runs `docker compose` (spec 0006, child 0007). It keeps running
    operations in memory only; it never checks, never stores history and never decides a rollback.

    Every call needs the consumer's binding token. Apply, remove, the images read and resolve
    need an `MP-Caller` token too (401 `invalid_token` without one). Every answer, error answers included, carries the
    `MP-Boot-Id` header: 16 random bytes, base64url, chosen at each start. A new value means the
    deployer restarted and forgot its running operations.

    Errors are a `ProblemList`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/stacks/{stack}/apply:
    post:
      operationId: applyStack
      summary: Write the stack's files and start it
      description: |
        Answers at once with the running operation; poll `/v1/operations/{id}` for its outcome.
        One operation per stack at a time; different stacks run in parallel.
      parameters:
        - $ref: "#/components/parameters/Stack"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRequest"
      responses:
        "202":
          description: The operation started.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An operation of this stack is still running (`busy`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "413":
          description: The body is over 8 MB (`request_too_large`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "422":
          description: |
            The stack is refused: `invalid_project`, `host_access`, `invalid_path`,
            `placed_missing` or `placed_invalid`, one problem per finding.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /v1/stacks/{stack}/remove:
    post:
      operationId: removeStack
      summary: Stop and remove the stack's containers
      description: |
        Runs `docker compose down`; with `deleteData` also its volumes, and deletes the stack's
        `secrets/` folder. The other files stay. Answers at once with the running operation.
      parameters:
        - $ref: "#/components/parameters/Stack"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveRequest"
      responses:
        "202":
          description: The operation started.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The stack has neither a folder nor a container (`not_found`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "409":
          description: An operation of this stack is still running (`busy`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "503":
          description: The container engine did not answer (`docker_unavailable`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /v1/operations/{id}:
    get:
      operationId: getOperation
      summary: Read one operation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The operation.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/stacks/{stack}/state:
    get:
      operationId: getStackState
      summary: Read the state of each container of the stack
      parameters:
        - $ref: "#/components/parameters/Stack"
      responses:
        "200":
          description: The stack's services, sorted by instance.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The container engine did not answer (`docker_unavailable`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /v1/stacks/{stack}/secrets:
    get:
      operationId: getStackSecrets
      summary: List the secret files of the stack that exist, never their content
      parameters:
        - $ref: "#/components/parameters/Stack"
      responses:
        "200":
          description: The paths, sorted.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentSecrets"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/stacks/{stack}/images:
    get:
      operationId: getStackImages
      summary: Read the stack's frozen image versions
      description: |
        The current and the previous lock from the stack's folder (spec 0031). A stack with
        containers but no `images.lock` answers `adopted: true` with a lock built from its
        containers. A stack with neither answers `adopted: false` and no lock.
      parameters:
        - $ref: "#/components/parameters/Stack"
      responses:
        "200":
          description: The locks.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackImages"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An operation of this stack is running, so the files may be mid rotation (`busy`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "500":
          description: A lock file does not decode or breaks a rule (`lock_invalid`, naming the file).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "503":
          description: The container engine did not answer (`docker_unavailable`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /v1/images/resolve:
    post:
      operationId: resolveImages
      summary: Resolve image references to their registry digests without pulling
      description: |
        Asks the registry, through the container engine, which manifest digest each reference
        names now. At most 4 lookups run at once, and the whole call ends after the deployer's
        resolve timeout; a reference still open then is a problem with reason `timeout`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: The digests found, and one `image_unresolved` problem per reference that failed.
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResult"
        "400":
          description: The body does not decode (`invalid_request`), or a reference is not a tagged image reference (`invalid_reference`, at `references[<n>]`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The container engine did not answer (`docker_unavailable`).
          headers:
            MP-Boot-Id:
              $ref: "#/components/headers/BootId"
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The consumer's binding token, one file per consumer in the deployer's clients directory (spec 0005).
  parameters:
    Stack:
      name: stack
      in: path
      required: true
      description: The stack, by its Compose project name `mp-<stack name>`.
      schema:
        type: string
        pattern: "^mp-[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
  headers:
    BootId:
      description: Chosen at each start of the deployer; a change means it forgot its running operations.
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The body or a parameter does not decode (`invalid_request`, `invalid_project`).
      headers:
        MP-Boot-Id:
          $ref: "#/components/headers/BootId"
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    Unauthorized:
      description: The binding token is missing or wrong (`unauthorized`), or apply or remove came without an `MP-Caller` token (`invalid_token`).
      headers:
        MP-Boot-Id:
          $ref: "#/components/headers/BootId"
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    NotFound:
      description: Unknown under this boot id (`not_found`).
      headers:
        MP-Boot-Id:
          $ref: "#/components/headers/BootId"
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
  schemas:
    ApplyRequest:
      type: object
      additionalProperties: false
      required: [stack, files, secrets]
      properties:
        stack:
          type: string
          format: uuid
          description: Every service's `stack` label must equal it.
        files:
          type: array
          items:
            $ref: "#/components/schemas/StackFile"
        secrets:
          type: array
          description: Every secret file the stack mounts, as the managed render lists them.
          items:
            $ref: "#/components/schemas/StackSecret"
        placed:
          type: array
          description: Values you supply for placed secrets; written once, replaced only with `replace`.
          items:
            $ref: "#/components/schemas/PlacedValue"
    StackFile:
      type: object
      additionalProperties: false
      required: [path, mode, data]
      properties:
        path:
          type: string
          description: "`docker-compose.yml`, `.env`, `graph.yaml`, `README.md`, `setup.sh`, `config/<instance>.env`, or a template output `config/<instance>/<file>`."
        mode:
          type: integer
        data:
          type: string
          format: byte
    StackSecret:
      type: object
      additionalProperties: false
      required: [path, kind, instance]
      properties:
        path:
          type: string
          description: "`secrets/<instance>/<name>`."
        kind:
          type: string
          enum: [generated, placed]
        instance:
          type: string
        capability:
          type: string
        field:
          type: string
          description: The capability field the placed file holds.
    PlacedValue:
      type: object
      additionalProperties: false
      required: [path, data]
      properties:
        path:
          type: string
        data:
          type: string
          format: byte
          description: The value, base64; not empty, at most 4096 bytes, no NUL byte.
        replace:
          type: boolean
          default: false
    RemoveRequest:
      type: object
      additionalProperties: false
      required: [deleteData]
      properties:
        deleteData:
          type: boolean
          description: Also remove the volumes and the `secrets/` folder.
    Operation:
      type: object
      additionalProperties: false
      required: [id, stack, action, status, step, startedAt]
      properties:
        id:
          type: string
        stack:
          type: string
        action:
          type: string
          enum: [apply, remove]
        status:
          type: string
          enum: [running, succeeded, failed]
        step:
          type: string
          enum: [prepare, pull, up, down, done]
          description: The last step reached.
        error:
          type: string
          description: A problem code, then at most the last 16 KB of Compose's output.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    StackState:
      type: object
      additionalProperties: false
      required: [present, services]
      properties:
        present:
          type: boolean
          description: False when the stack has neither containers nor a folder.
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceState"
    ServiceState:
      type: object
      additionalProperties: false
      required: [instance, module, state, restartCount, image]
      properties:
        instance:
          type: string
        module:
          type: string
        state:
          type: string
          enum: [pending, starting, running, unhealthy, restarting, exited, paused]
        health:
          type: string
          description: "`starting`, `healthy` or `unhealthy`; empty without a healthcheck."
        exitCode:
          type: integer
          description: Set when `exited`.
          # keep the pointer: exit code 0 is a value
          x-go-type-skip-optional-pointer: false
        lastExitCode:
          type: integer
          description: >-
            The code of the most recent exit, any cause (a `docker stop` counts too); absent when
            unknown, never 0 for unknown. For `exited`, `dead` and `restarting` it is the current
            exit code; otherwise it comes from the Docker `die` events the deployer has seen since
            it started, so a crash Docker restarted at once still shows.
          # keep the pointer: exit code 0 is a value
          x-go-type-skip-optional-pointer: false
        restartCount:
          type: integer
        image:
          type: string
        since:
          type: string
          format: date-time
          description: When the container entered its current state.
    PresentSecrets:
      type: object
      additionalProperties: false
      required: [present]
      properties:
        present:
          type: array
          items:
            type: string
    StackImages:
      type: object
      additionalProperties: false
      required: [adopted]
      properties:
        adopted:
          type: boolean
          description: True when `current` was built from the running containers because the folder has no `images.lock`.
        current:
          description: The lock of the last succeeded apply; absent when there is none.
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: "#/components/schemas/ImageLock"
        previous:
          description: The lock that was current before it; absent when there is none.
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: "#/components/schemas/ImageLock"
    ImageLock:
      type: object
      additionalProperties: false
      required: [formatVersion, stack, operation, writtenAt, images]
      description: The lock file format (spec 0031); `present` exists only in this answer.
      properties:
        formatVersion:
          type: integer
        stack:
          type: string
        operation:
          type: string
        writtenAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: "#/components/schemas/LockedImage"
    LockedImage:
      type: object
      additionalProperties: false
      required: [reference, source, imageId, present]
      properties:
        reference:
          type: string
        source:
          type: string
          enum: [registry, built]
        digest:
          type: string
          description: Set for `registry`.
        imageId:
          type: string
        present:
          type: boolean
          description: The image is on the host under the name Compose looks up (`reference@digest`, or the image ID for `built`).
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [references]
      properties:
        references:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            maxLength: 255
    ResolveResult:
      type: object
      additionalProperties: false
      required: [images, problems]
      properties:
        images:
          type: array
          description: Sorted by reference.
          items:
            $ref: "#/components/schemas/ResolvedImage"
        problems:
          type: array
          description: One `image_unresolved` per reference that failed, at `references[<n>]`, the reason in plain words.
          items:
            $ref: "./renderer.yaml#/components/schemas/Problem"
    ResolvedImage:
      type: object
      additionalProperties: false
      required: [reference, digest]
      properties:
        reference:
          type: string
        digest:
          type: string
