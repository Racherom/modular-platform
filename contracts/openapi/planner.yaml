openapi: 3.1.0
info:
  title: Modular Platform planner
  version: 0.1.0
  summary: Plans a graph of modules against the built in catalog and renders it as a runnable zip.
  description: |
    The planner is stateless. Every request carries the whole graph; nothing is stored.
    Formats are the provisional `modular-platform/v0alpha1` shapes (spec 0002), replaced by `v1` later.

    Request bodies are decoded strictly: unknown keys and duplicate keys are rejected with 400.

    In public mode no credential is needed. In internal mode every call needs the bearer token.
    `/v1/render/managed` exists in internal mode only (spec 0006).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - {}
  - bearerAuth: []
paths:
  /v1/catalog:
    get:
      operationId: getCatalog
      summary: List the built in catalog
      responses:
        "200":
          description: Every catalog entry, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TimedOut"
  /v1/plan:
    post:
      operationId: plan
      summary: Check a graph and fill in its automatic bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Graph"
      responses:
        "200":
          description: The plan. `ok` is false when a problem has severity `error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
        "400":
          $ref: "#/components/responses/BadGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TimedOut"
  /v1/render:
    post:
      operationId: render
      summary: Render a graph as a zip you run with Docker Compose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Graph"
      responses:
        "200":
          description: The zip. It never contains a secret value.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<graph name>.zip"`'
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "400":
          $ref: "#/components/responses/BadGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          description: The plan has an error, so nothing was rendered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TimedOut"
  /v1/render/managed:
    post:
      operationId: renderManaged
      summary: Render a graph as the files the managed deployer applies
      description: |
        Internal mode only; public mode answers 404. The project is `mp-<graph name>`; every
        service carries the platform labels and `restart: unless-stopped`. The answer lists every
        secret file the project needs, never a value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedRenderRequest"
      responses:
        "200":
          description: The rendered project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderedProject"
        "400":
          $ref: "#/components/responses/BadGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Public mode (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemList"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          description: The plan has an error, so nothing was rendered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
        "503":
          $ref: "#/components/responses/TimedOut"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Internal mode only. Each consumer sends its binding token; the planner accepts the tokens in the files of `MP_PLANNER_CLIENTS_DIR`, one per consumer (spec 0005).
  responses:
    BadGraph:
      description: |
        The body does not decode strictly (`invalid_graph`), or names another `apiVersion`
        (`unsupported_version`) or `kind` (`wrong_kind`). Exactly one problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemList"
    Unauthorized:
      description: Internal mode, and the bearer token is missing or wrong (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemList"
    TooLarge:
      description: The body is over 1 MB (`request_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemList"
    TimedOut:
      description: The request took longer than 10 seconds (`timeout`); nothing was kept.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemList"
    RateLimited:
      description: Public mode, and this client IP is over its request rate (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the next request is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemList"
  schemas:
    Graph:
      type: object
      description: A stack, as saved in `graph.yaml`. Holds no positions, no settings and never a secret value.
      additionalProperties: false
      required: [apiVersion, kind, name, modules]
      properties:
        apiVersion:
          type: string
          description: Exactly `modular-platform/v0alpha1`.
        kind:
          type: string
          description: Exactly `Graph`.
        name:
          type: string
          description: The stack's name and the Compose project name. A DNS label, not a reserved word.
        modules:
          type: object
          description: One entry per placed module, keyed by instance name (also the Compose service name).
          additionalProperties:
            $ref: "#/components/schemas/GraphModule"
    GraphModule:
      type: object
      additionalProperties: false
      required: [module]
      properties:
        module:
          type: string
          description: The catalog entry this instance runs.
        uses:
          $ref: "#/components/schemas/Uses"
          # keep the pointer: `uses: {}` and no `uses` must write back differently
          x-go-type-skip-optional-pointer: false
    Uses:
      type: object
      description: |
        Capability to provider instance name. `null` leaves an optional need unbound on purpose.
        A missing key means not decided: the planner may bind a required need or warn about an optional one.
      additionalProperties:
        type: [string, "null"]
    Catalog:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEntry"
    CatalogEntry:
      type: object
      description: One module of the built in catalog (`catalog/<name>.yaml`).
      additionalProperties: false
      required: [apiVersion, kind, name, description, image]
      properties:
        apiVersion:
          type: string
          description: Exactly `modular-platform/v0alpha1`.
        kind:
          type: string
          description: Exactly `Module`.
        name:
          type: string
          description: Equal to the file name without `.yaml`; unique in the catalog.
        description:
          type: string
        image:
          type: string
          description: An image reference with a tag other than `latest`, optionally followed by a digest.
        runtime:
          type: string
          enum: [sdk]
          description: |
            `sdk` when the image is built on the module SDK (spec 0005): the render gives it the
            bootstrap env and its env file, and it listens on 8080 (plain) or 8443 (TLS).
        config:
          type: object
          description: Value name to one declared config value, read by the SDK (spec 0005).
          additionalProperties:
            $ref: "#/components/schemas/ConfigValue"
        provides:
          type: object
          description: Capability to where a consumer reaches it.
          additionalProperties:
            $ref: "#/components/schemas/Provide"
        uses:
          type: object
          description: Capability to how this module consumes it.
          additionalProperties:
            $ref: "#/components/schemas/Use"
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/Secret"
        healthcheck:
          $ref: "#/components/schemas/Healthcheck"
          # keep the pointer: render tells a missing healthcheck from an empty one
          x-go-type-skip-optional-pointer: false
    Provide:
      type: object
      additionalProperties: false
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: "The port on the service's host name. Required, except on a `runtime: sdk` entry, which must not set it."
        auth:
          type: string
          enum: [binding-token]
          description: "`binding-token`: every consumer calls with its own per binding token."
        env:
          $ref: "#/components/schemas/ProvideEnv"
          # keep the pointer: a provide without env stays without it in the catalog answer
          x-go-type-skip-optional-pointer: false
    ProvideEnv:
      type: object
      additionalProperties: false
      properties:
        clients_dir:
          type: string
          description: Env var set to the directory holding one token file per consumer; required with `auth`.
    Use:
      type: object
      additionalProperties: false
      properties:
        optional:
          type: boolean
          default: false
        client:
          type: string
          enum: [http, postgresql, s3]
          description: "The client the SDK builds for this binding; only on a `runtime: sdk` entry."
        env:
          $ref: "#/components/schemas/UseEnv"
    UseEnv:
      type: object
      description: |
        Env var names the consumer reads the binding from. An omitted key delivers nothing. Every
        binding takes host, port, url, token_file and ca_file; a postgresql client also database,
        user, password_file and sslmode; an s3 client also bucket, region, access_key_id and
        secret_access_key_file.
      additionalProperties: false
      properties:
        host:
          type: string
        port:
          type: string
        url:
          type: string
        token_file:
          type: string
        ca_file:
          type: string
        database:
          type: string
        user:
          type: string
        password_file:
          type: string
        sslmode:
          type: string
        bucket:
          type: string
        region:
          type: string
        access_key_id:
          type: string
        secret_access_key_file:
          type: string
    ConfigValue:
      type: object
      description: One value a module built on the SDK reads at start (spec 0005).
      additionalProperties: false
      required: [env, type, description]
      properties:
        env:
          type: string
          description: Env var name, `^[A-Z][A-Z0-9_]*$`; `<env>_FILE` names a file holding the value.
        type:
          type: string
          enum: [string, int, bool, duration, url, enum, secret]
        description:
          type: string
          description: One sentence; the Go doc comment and the env file comment.
        default:
          type: string
          description: Parsed by type and checked by the rules; not allowed on a secret.
        optional:
          type: boolean
          default: false
        min:
          $ref: "#/components/schemas/ConfigBound"
          # keep the pointer: an unset union has nothing to marshal
          x-go-type-skip-optional-pointer: false
        max:
          $ref: "#/components/schemas/ConfigBound"
          # keep the pointer: an unset union has nothing to marshal
          x-go-type-skip-optional-pointer: false
        pattern:
          type: string
          description: RE2, matched against the whole value; string only.
        values:
          type: array
          items:
            type: string
          description: The allowed values; enum only, required there.
        generate:
          type: boolean
          default: false
          description: The render creates the secret as 32 random bytes in hex; secret only.
    ConfigBound:
      description: A whole number for an `int`, a duration like `10s` for a `duration`.
      oneOf:
        - type: integer
        - type: string
    Secret:
      type: object
      description: Created by `setup.sh` as `secrets/<instance>/<name>`, mounted as the Compose secret `<instance>_<name>`.
      additionalProperties: false
      required: [name, env]
      properties:
        name:
          type: string
        env:
          type: string
          description: Env var set to the secret file's path inside the container.
    Healthcheck:
      type: object
      description: A Compose healthcheck, copied as is into the service.
      additionalProperties: false
      required: [test]
      properties:
        test:
          type: array
          items:
            type: string
          description: First item is `CMD` or `CMD-SHELL`.
        interval:
          type: string
        timeout:
          type: string
        retries:
          type: integer
          minimum: 1
          # keep the pointer: a written `retries: 0` must be rejected, not read as absent
          x-go-type-skip-optional-pointer: false
        start_period:
          type: string
    Binding:
      type: object
      additionalProperties: false
      required: [consumer, capability, provider, auto]
      properties:
        consumer:
          type: string
        capability:
          type: string
        provider:
          type: string
        auto:
          type: boolean
          description: True when the planner made this binding, not the graph.
    Problem:
      type: object
      additionalProperties: false
      required: [severity, code, path, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        path:
          type: string
          description: Dotted from the graph root, like `modules.whoami.uses.postgresql`; empty for the whole request.
        message:
          type: string
          description: One English sentence, shown as is.
        candidates:
          type: array
          items:
            type: string
    ProblemList:
      type: object
      additionalProperties: false
      required: [problems]
      properties:
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    PlanResult:
      type: object
      additionalProperties: false
      required: [ok, graph, bindings, problems]
      properties:
        ok:
          type: boolean
        graph:
          $ref: "#/components/schemas/Graph"
        bindings:
          type: array
          description: Explicit and automatic bindings, sorted by consumer then capability.
          items:
            $ref: "#/components/schemas/Binding"
        problems:
          type: array
          description: Sorted by path, then code.
          items:
            $ref: "#/components/schemas/Problem"
        digest:
          type: string
          description: |
            `sha256:<hex>` over the canonical graph, the bindings and the catalog entries the graph
            uses; set only when `ok` is true. Equal digests mean the same project is rendered.
    ManagedRenderRequest:
      type: object
      additionalProperties: false
      required: [graph, deployment]
      properties:
        graph:
          $ref: "#/components/schemas/Graph"
        deployment:
          type: string
          format: uuid
          description: The deployment id, written into every service's `deployment` label.
    RenderedProject:
      type: object
      additionalProperties: false
      required: [project, plan, images, publishedPorts, secrets, files]
      properties:
        project:
          type: string
          description: The Compose project name, `mp-<graph name>`.
        plan:
          $ref: "#/components/schemas/PlanResult"
        images:
          type: array
          description: One entry per instance, sorted by instance.
          items:
            $ref: "#/components/schemas/ModuleImage"
        publishedPorts:
          type: array
          description: Host ports the project publishes; always empty in `v0alpha1`.
          items:
            $ref: "#/components/schemas/PublishedPort"
        secrets:
          type: array
          description: Every secret file the project mounts, sorted by path.
          items:
            $ref: "#/components/schemas/RenderedSecret"
        files:
          type: array
          description: The project's files, sorted by path.
          items:
            $ref: "#/components/schemas/RenderedFile"
    ModuleImage:
      type: object
      additionalProperties: false
      required: [instance, module, image]
      properties:
        instance:
          type: string
        module:
          type: string
        image:
          type: string
    PublishedPort:
      type: object
      additionalProperties: false
      required: [instance, published, target]
      properties:
        instance:
          type: string
        published:
          type: integer
        target:
          type: integer
    RenderedSecret:
      type: object
      additionalProperties: false
      required: [path, kind, instance]
      properties:
        path:
          type: string
          description: "`secrets/<instance>/<name>`, relative to the project folder."
        kind:
          type: string
          enum: [generated, placed]
          description: "`generated`: the deployer creates it as 32 random bytes in hex. `placed`: you supply it."
        instance:
          type: string
        capability:
          type: string
          description: Placed only, the binding's capability.
        field:
          type: string
          enum: [password, secret_key]
          description: Placed only, which credential of the binding it holds.
    RenderedFile:
      type: object
      additionalProperties: false
      required: [path, mode, data]
      properties:
        path:
          type: string
        mode:
          type: integer
          description: The file mode, like 420 for 0644.
        data:
          type: string
          format: byte
          description: The content, base64.
