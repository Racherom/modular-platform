openapi: 3.1.0
info:
  title: Modular Platform api
  version: 0.1.0
  summary: The managed platform's control plane, called by the editor.
  description: |
    `api` keeps the record (sessions, stacks, an append only history), asks the renderer to
    check and render, and drives the deploy target (spec 0006). Paths sit under `<base>/api/v1`;
    the base is empty in thread 1.

    Every route except the auth routes needs the admin's session cookie. Every mutating route
    also needs an `Origin` header exactly equal to the public origin (403 `bad_origin`). Errors
    are a `ProblemList`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/auth/login:
    get:
      operationId: login
      summary: Start a sign in at the identity provider
      security: []
      parameters:
        - name: return_to
          in: query
          description: A path under `<base>/` to come back to; anything else becomes `<base>/`.
          schema:
            type: string
      responses:
        "302":
          description: To the provider. Sets `__Host-mp_login` (state, PKCE verifier, nonce, return path; 10 minutes).
          headers:
            Location:
              schema:
                type: string
        "503":
          description: The provider has not answered discovery yet (`provider_unavailable`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /api/v1/auth/callback:
    get:
      operationId: callback
      summary: Finish a sign in
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: |
            Signed in: sets the session cookie and goes to the return path. The sign in that
            binds the first admin also deletes the setup cookie. Refused: goes to
            `<base>/?signed_out=<reason>`, reason `not_admin`, `state_mismatch`, `provider_error`
            or `setup_pending` (no valid setup session while no admin is bound).
          headers:
            Location:
              schema:
                type: string
  /api/v1/setup:
    get:
      operationId: getSetup
      summary: The state of the first run setup
      description: |
        Public. Without a setup session it shows only `state` (and `reason`). `providerReady`
        and `enroll` come only with a valid setup session.
      security: []
      responses:
        "200":
          description: The setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupState"
  /api/v1/setup/code:
    post:
      operationId: redeemSetupCode
      summary: Trade the setup code for a setup session
      description: |
        Public, rate limited to 10 tries a minute per client address (the last `X-Forwarded-For`
        hop). The code is accepted once. Needs the public `Origin`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCode"
      responses:
        "204":
          description: Sets the setup cookie (`__Host-mp_setup`, or `__Secure-mp_setup` under a base path; 24 hours).
        "401":
          description: The code is not accepted (`code_refused`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "403":
          $ref: "#/components/responses/BadOrigin"
        "409":
          description: The setup is done (`setup_done`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "429":
          description: Too many tries (`too_many_tries`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /api/v1/setup/enroll:
    post:
      operationId: enrollSetup
      summary: Make the first user at the identity module
      description: |
        Needs the setup cookie. Passes the answers to the keeper, which runs the identity
        module's `enroll` block; enrolling again before the first sign in replaces the user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupEnroll"
      responses:
        "204":
          description: The user exists.
        "401":
          description: No valid setup session (`no_session`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "403":
          $ref: "#/components/responses/BadOrigin"
        "409":
          description: The setup is done (`setup_done`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "422":
          description: An answer breaks a rule (`invalid_answer`, at `answers.<name>`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "502":
          description: The enroll run failed (`enroll_failed`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "503":
          description: The keeper is busy (`busy`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      responses:
        "200":
          description: The session is gone and both cookies are cleared. Go to `redirect` next.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logout"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BadOrigin"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Who is signed in, and until when
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/catalog:
    get:
      operationId: getCatalog
      summary: List the catalog, as the renderer answers it
      responses:
        "200":
          description: Every catalog entry, sorted by name.
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/Catalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "502":
          $ref: "#/components/responses/RendererError"
  /api/v1/check:
    post:
      operationId: check
      summary: Check a graph and resolve its defaults, as the renderer answers it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./renderer.yaml#/components/schemas/Graph"
      responses:
        "200":
          description: The check result.
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/CheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BadOrigin"
        "413":
          $ref: "#/components/responses/TooLarge"
        "502":
          $ref: "#/components/responses/RendererError"
  /api/v1/render:
    post:
      operationId: render
      summary: Render a graph as the static zip, as the renderer answers it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./renderer.yaml#/components/schemas/Graph"
      responses:
        "200":
          description: The zip, byte for byte what the online editor gives for the same graph.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BadOrigin"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          description: The graph has an error, so nothing was rendered.
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/CheckResult"
        "502":
          $ref: "#/components/responses/RendererError"
  /api/v1/stacks:
    get:
      operationId: listStacks
      summary: List the stacks, sorted by name
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The last name of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/stacks/{name}:
    get:
      operationId: getStack
      summary: Read a stack with the live state of its modules
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: The stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stack"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/stacks/{name}/operations:
    get:
      operationId: listOperations
      summary: The stack's history, newest first
      parameters:
        - $ref: "#/components/parameters/Name"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The last operation id of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/stacks/{name}/review:
    post:
      operationId: reviewStack
      summary: Show exactly what an apply of this graph would run
      description: |
        Writes nothing and touches nothing on the host. Every image is frozen to a digest (spec
        0031): a reference in the stack's current lock keeps its digest unless it is in `update`;
        any other is resolved at the registry without pulling.
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BadOrigin"
        "413":
          $ref: "#/components/responses/TooLarge"
        "409":
          description: An operation of this stack runs, so its image versions cannot be read (`busy`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "422":
          $ref: "#/components/responses/Refused"
        "502":
          $ref: "#/components/responses/RendererError"
        "503":
          $ref: "#/components/responses/DeployerUnavailable"
  /api/v1/stacks/{name}/apply:
    post:
      operationId: applyStack
      summary: Deploy a reviewed graph
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRequest"
      responses:
        "202":
          description: |
            The operation, `running`; or `failed` with `deployer_unavailable` when the deploy
            target did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BadOrigin"
        "409":
          description: An operation of this stack runs (`busy`), or the check result or an image version differs from the reviewed one (`graph_changed`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Refused"
        "502":
          $ref: "#/components/responses/RendererError"
        "503":
          $ref: "#/components/responses/DeployerUnavailable"
  /api/v1/stacks/{name}/remove:
    post:
      operationId: removeStack
      summary: Stop and remove a stack's containers
      description: |
        Keeps volumes, secrets and the history, so a later apply brings the stack back with its
        data. With `deleteData` the volumes and secrets go too, and `confirmName` must equal the
        name. A plain remove of a removed stack answers 409 `already_removed`.
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveRequest"
      responses:
        "202":
          description: |
            The operation, `running`; or `failed` with `deployer_unavailable` when the deploy
            target did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BadOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An operation of this stack runs (`busy`), or it is removed already (`already_removed`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "422":
          description: "`confirmName` is not the stack's name (`confirm_mismatch`)."
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
        "502":
          description: The deploy target refused api's call, a wiring fault (`deployer_error`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
  /api/v1/events:
    get:
      operationId: events
      summary: Live updates as server sent events
      description: |
        `snapshot` first, then `stack`, `operation`, `modules` (only with the filter) and
        `signed-out`; a `: ping` comment every 15 seconds. Each `data:` line is one JSON object:
        `snapshot` is `EventSnapshotList` without the filter and a `Stack` with it,
        `stack` a `StackSummary`, `operation` an `EventOperation`, `modules` an
        `EventModules`, `signed-out` an `EventSignedOut`. A reconnect gets a new `snapshot`;
        nothing is replayed.
      parameters:
        - name: stack
          in: query
          description: Follow one stack, with the live state of its modules.
          schema:
            type: string
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: More than 8 open streams for this session (`too_many_streams`).
          content:
            application/json:
              schema:
                $ref: "./renderer.yaml#/components/schemas/ProblemList"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mp_session
      description: HttpOnly, Secure, SameSite=Lax. Only the bound admin ever gets one.
  parameters:
    Name:
      name: name
      in: path
      required: true
      description: The stack name, equal to its graph's `name`.
      schema:
        type: string
  responses:
    BadRequest:
      description: The body or a parameter does not decode (`invalid_request`, or the graph's own codes).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    Unauthenticated:
      description: No valid session (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    BadOrigin:
      description: The `Origin` header is missing or not the public origin (`bad_origin`).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    NotFound:
      description: No such stack (`not_found`).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    TooLarge:
      description: The body is over 1 MB (`request_too_large`).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    Refused:
      description: |
        Nothing happened: `name_mismatch`, `reserved_name`, the check result's own problems,
        `host_access`, `invalid_project`, `placed_missing`, `placed_invalid`, `invalid_update`
        (an `update` entry the graph does not run), or `image_unresolved` (one per reference
        the registry could not resolve, naming what uses it).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    RendererError:
      description: The renderer did not answer as its contract says (`renderer_error`).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
    DeployerUnavailable:
      description: The deploy target did not answer (`deployer_unavailable`).
      content:
        application/json:
          schema:
            $ref: "./renderer.yaml#/components/schemas/ProblemList"
  schemas:
    Logout:
      type: object
      additionalProperties: false
      required: [redirect]
      properties:
        redirect:
          type: string
          description: The provider's sign out page, or `<base>/`.
    SetupState:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, done]
        reason:
          type: string
          enum: [no_code]
          description: "Only while pending. `no_code`: no code file exists, so remove `<state>/.setup-done` and restart the keeper."
        session:
          type: boolean
          description: Whether the request carries a valid setup session. Only while pending.
        providerReady:
          type: boolean
          description: Whether OIDC discovery against the issuer has succeeded. Only with a session.
        enroll:
          $ref: "#/components/schemas/SetupEnrollAsks"
          # keep the pointer: absent means the identity module has no enroll block
          x-go-type-skip-optional-pointer: false
    SetupEnrollAsks:
      type: object
      additionalProperties: false
      required: [asks]
      description: The identity module's enroll questions, asked on the setup page in this order.
      properties:
        asks:
          type: array
          items:
            $ref: "#/components/schemas/SetupAsk"
    SetupAsk:
      type: object
      additionalProperties: false
      required: [name, description, secret]
      properties:
        name:
          type: string
        description:
          type: string
        secret:
          type: boolean
        pattern:
          type: string
        minLength:
          type: integer
    SetupCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
    SetupEnroll:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: object
          description: Ask name to answer.
          additionalProperties:
            type: string
    Session:
      type: object
      additionalProperties: false
      required: [expiresAt, idleExpiresAt]
      properties:
        email:
          type: string
          description: Absent when the identity provider's claims carry none.
        expiresAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
    StackState:
      type: string
      enum: [applying, rolling-back, removing, running, rolled-back, removed, failed, unknown]
    StackSummary:
      type: object
      additionalProperties: false
      required: [name, state]
      properties:
        name:
          type: string
        state:
          $ref: "#/components/schemas/StackState"
        latestOperation:
          $ref: "#/components/schemas/Operation"
    StackPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StackSummary"
        next:
          type: string
          description: The cursor of the next page; absent on the last one.
    Stack:
      type: object
      additionalProperties: false
      required: [name, state, composeProject, createdAt]
      properties:
        name:
          type: string
        state:
          $ref: "#/components/schemas/StackState"
        latestOperation:
          $ref: "#/components/schemas/Operation"
        composeProject:
          type: string
        createdAt:
          type: string
          format: date-time
        graph:
          $ref: "./renderer.yaml#/components/schemas/Graph"
          description: The graph of the latest succeeded apply.
        latestApplyGraph:
          $ref: "./renderer.yaml#/components/schemas/Graph"
          description: |
            The graph of the newest apply, whatever its status; *Apply again* reviews it. A
            rollback counts, so after a failed rollback it is the last good graph.
        rolledBackFrom:
          $ref: "#/components/schemas/Operation"
          description: The failed operation, when `rolled-back`.
        modules:
          type: array
          description: Sorted by instance; absent when `stateError` is set.
          items:
            $ref: "#/components/schemas/ModuleState"
        stateError:
          type: string
          description: Why the live state could not be read.
    Operation:
      type: object
      additionalProperties: false
      required: [id, action, status, startedAt, startedBy, deleteData, placedSupplied]
      properties:
        id:
          type: string
        action:
          type: string
          enum: [apply, remove]
        status:
          type: string
          enum: [running, succeeded, failed, unknown]
        step:
          type: string
          enum: [prepare, pull, up, down, done]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        startedBy:
          type: string
          description: The email of who started it.
        error:
          type: string
        rollbackOf:
          type: string
        deleteData:
          type: boolean
        placedSupplied:
          type: array
          description: Paths of the placed values this apply wrote; never the values.
          items:
            type: string
        digest:
          type: string
    OperationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        next:
          type: string
    ModuleState:
      type: object
      additionalProperties: false
      required: [instance, module, state, restartCount]
      properties:
        instance:
          type: string
        module:
          type: string
        state:
          type: string
          enum: [pending, starting, running, unhealthy, restarting, exited, paused, missing]
        exitCode:
          type: integer
          description: Set when `exited`; the `exited <code>` badge reads it.
          # keep the pointer: exit code 0 is a value
          x-go-type-skip-optional-pointer: false
        lastExitCode:
          type: integer
          description: >-
            The code of the most recent exit, any cause; absent when unknown, never 0 for unknown.
            Copied from the deploy target, which loses it when it restarts.
          # keep the pointer: exit code 0 is a value
          x-go-type-skip-optional-pointer: false
        health:
          type: string
        restartCount:
          type: integer
        image:
          type: string
        since:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [graph]
      properties:
        graph:
          $ref: "./renderer.yaml#/components/schemas/Graph"
        checkNewer:
          type: boolean
          default: false
          description: Also ask the registry about every frozen reference and show `available` when it differs.
        update:
          type: array
          description: References to take at their newest digest instead of the frozen one.
          items:
            type: string
    Review:
      type: object
      additionalProperties: false
      required: [check, digest, modules, images, bindings, publishedPorts, placed]
      properties:
        check:
          $ref: "./renderer.yaml#/components/schemas/CheckResult"
        digest:
          type: string
          description: The review digest, over `check.digest` and the frozen lock; apply sends it back.
        images:
          type: array
          description: One row per image reference the stack runs, sorted by reference.
          items:
            $ref: "#/components/schemas/ReviewImage"
        modules:
          type: array
          items:
            $ref: "./renderer.yaml#/components/schemas/ModuleImage"
        bindings:
          type: array
          items:
            $ref: "./renderer.yaml#/components/schemas/Binding"
        publishedPorts:
          type: array
          items:
            $ref: "./renderer.yaml#/components/schemas/PublishedPort"
        placed:
          type: array
          items:
            $ref: "#/components/schemas/PlacedCredential"
    ReviewImage:
      type: object
      additionalProperties: false
      required: [reference, usedBy, digest, change, present]
      properties:
        reference:
          type: string
        usedBy:
          type: array
          items:
            $ref: "#/components/schemas/ReviewImageUser"
        digest:
          type: string
          description: The digest the apply will run.
        change:
          type: string
          enum: [frozen, new, updated]
        previousDigest:
          type: string
          description: The frozen digest it replaces, for `updated`.
        available:
          type: string
          description: With `checkNewer`, the registry's digest when it differs from `digest`.
        checkFailed:
          type: string
          description: >-
            With `checkNewer`, on a `frozen` row not named in `update` whose registry lookup
            failed: the reason alone in plain words. Never set together with `available`; a failed
            lookup does not mean nothing newer exists.
        present:
          type: boolean
          description: False when the image is not on the host; the apply pulls it by digest.
    ReviewImageUser:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [module, provision, revoke]
        instance:
          type: string
          description: The module instance; for a job, the provider instance.
        capability:
          type: string
          description: Jobs only, the provisioner capability.
        consumer:
          type: string
          description: Provision jobs only, the binding's consumer.
    PlacedCredential:
      type: object
      additionalProperties: false
      required: [path, instance, capability, field, exists]
      properties:
        path:
          type: string
        instance:
          type: string
        capability:
          type: string
        field:
          type: string
          description: The capability field the placed file holds.
        exists:
          type: boolean
    ApplyRequest:
      type: object
      additionalProperties: false
      required: [graph, digest]
      properties:
        graph:
          $ref: "./renderer.yaml#/components/schemas/Graph"
        digest:
          type: string
          description: The `digest` of the review you confirmed.
        update:
          type: array
          description: The same `update` list the review used.
          items:
            type: string
        placed:
          type: array
          items:
            $ref: "#/components/schemas/PlacedInput"
    RemoveRequest:
      type: object
      additionalProperties: false
      required: [deleteData]
      properties:
        deleteData:
          type: boolean
          description: Also delete the volumes and secrets; the data is gone for good.
        confirmName:
          type: string
          description: Required with `deleteData`; must equal the stack's name.
    PlacedInput:
      type: object
      additionalProperties: false
      required: [path, value]
      properties:
        path:
          type: string
        value:
          type: string
          description: Not empty, at most 4096 bytes, no NUL byte. Never stored, logged or sent back.
        replace:
          type: boolean
          default: false
    EventSnapshotList:
      type: object
      additionalProperties: false
      required: [stacks]
      properties:
        stacks:
          type: array
          items:
            $ref: "#/components/schemas/StackSummary"
    EventOperation:
      type: object
      additionalProperties: false
      required: [stack, operation]
      properties:
        stack:
          type: string
        operation:
          $ref: "#/components/schemas/Operation"
    EventModules:
      type: object
      additionalProperties: false
      required: [stack, modules]
      properties:
        stack:
          type: string
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleState"
    EventSignedOut:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [expired, signed_out]
