# task dev:managed: applied over the rendered build/managed/docker-compose.yml. The platform's own
# images are built from this checkout, and the ingress serves the Vite dev server on the host
# instead of the web image, so hot reload runs on the real origin. MP_WEB_UPSTREAM is a dev hook
# only this overlay sets (spec 0025).
services:
  ingress:
    environment:
      MP_WEB_UPSTREAM: host.docker.internal:5173
    extra_hosts:
      - host.docker.internal:host-gateway

  web:
    # not started in dev; the Vite dev server takes its place
    profiles: [web-image]

  api:
    image: ghcr.io/racherom/modular-platform/api:dev
    build:
      context: ../..
      dockerfile: catalog/modules/api/Dockerfile

  renderer:
    image: ghcr.io/racherom/modular-platform/renderer:dev
    build:
      context: ../..
      dockerfile: catalog/modules/renderer/Dockerfile

  deployer-docker:
    image: ghcr.io/racherom/modular-platform/deployer-docker:dev
    build:
      context: ../..
      dockerfile: catalog/modules/deployer-docker/Dockerfile
