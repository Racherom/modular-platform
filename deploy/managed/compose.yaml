# The managed platform (spec 0006): unzip, run `sh setup.sh` once, then `docker compose up -d`.
# Every image below is a bundled default (#23). Image tags are written here literally, because a
# plain `docker compose up -d` reads only .env; release-please bumps the platform's own tags.
# Secrets live in secrets/, created by setup.sh, and reach a service only as a Compose secret.
name: modular-platform

x-platform-labels: &platform-labels
  io.github.racherom.modular-platform.deployment: platform

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# the caddy binary carries the bind capability as a file capability, so it must stay in the set
x-caddy-hardening: &caddy-hardening
  <<: *hardening
  cap_add: [NET_BIND_SERVICE]

services:
  ingress:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    <<: *caddy-hardening
    # the platform user, so api can read the local CA Caddy writes 0600 into caddy_data; Docker
    # lets containers bind ports below 1024 without a capability
    user: "${PLATFORM_UID:?run setup.sh first}:${PLATFORM_GID:?run setup.sh first}"
    tmpfs: [/tmp]
    ports:
      - "${PLATFORM_HTTPS_PORT:-443}:443"
      - "${PLATFORM_HTTP_PORT:-80}:80"
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?run setup.sh first}
      PLATFORM_TLS: ${PLATFORM_TLS:-internal}
      PLATFORM_ACME_EMAIL: ${PLATFORM_ACME_EMAIL:-}
      MP_BASE_PATH: ${PLATFORM_BASE_PATH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # api reaches the identity provider at the public origin, through the ingress
        aliases: ["${PLATFORM_DOMAIN}"]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: ingress
      io.github.racherom.modular-platform.module: caddy
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  web:
    image: ghcr.io/racherom/modular-platform/web:0.0.0 # x-release-please-version
    restart: unless-stopped
    <<: *caddy-hardening
    tmpfs: [/tmp]
    environment:
      MP_BASE_PATH: ${PLATFORM_BASE_PATH:-}
      # the planner contract's paths (/v1/catalog, ...) sit under api at <base>/api/v1/...
      MP_API_ROOT: ${PLATFORM_BASE_PATH:-}/api
      MP_MODE: managed
      MP_SIGNED_OUT: ${PLATFORM_SIGNED_OUT:-index}
    networks: [edge]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: web
      io.github.racherom.modular-platform.module: web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  api:
    image: ghcr.io/racherom/modular-platform/api:0.0.0 # x-release-please-version
    restart: unless-stopped
    <<: *hardening
    user: "${PLATFORM_UID}:${PLATFORM_GID}"
    environment:
      MP_INSTANCE: api
      MP_DOMAIN: modular-platform.internal
      MP_OIDC_ISSUER: ${PLATFORM_ORIGIN:?run setup.sh first}${PLATFORM_BASE_PATH:-}/auth
      MP_OIDC_CLIENT_SECRET_FILE: /run/secrets/api_oidc_client_secret
      # Caddy's local root, while PLATFORM_TLS is internal (spec 0001)
      MP_OIDC_CA_FILE: /caddy-data/caddy/pki/authorities/local/root.crt
      MP_PUBLIC_ORIGIN: ${PLATFORM_ORIGIN}
      MP_BASE_PATH: ${PLATFORM_BASE_PATH:-}
      MP_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?run setup.sh first}
      MP_PROXY_HOPS: "1"
      MP_SESSION_IDLE: ${PLATFORM_SESSION_IDLE:-1h}
      MP_SESSION_MAX: ${PLATFORM_SESSION_MAX:-12h}
      MP_PLANNER_URL: http://planner.modular-platform.internal:8080
      MP_PLANNER_TOKEN_FILE: /run/secrets/uses/planner/token
      MP_DEPLOY_TARGET_URL: http://deployer-docker.modular-platform.internal:8080
      MP_DEPLOY_TARGET_TOKEN_FILE: /run/secrets/uses/deploy-target/token
      MP_DATABASE_URL: postgres://postgres:5432
      MP_DATABASE_NAME: platform_api
      MP_DATABASE_USER: api
      MP_DATABASE_PASSWORD_FILE: /run/secrets/api_db_password
      MP_DATABASE_SSLMODE: disable
      MP_CALLER_SIGNING_KEY_FILE: /run/secrets/caller_signing_key
    secrets:
      - source: api_uses_planner
        target: /run/secrets/uses/planner/token
      - source: api_uses_deploy-target
        target: /run/secrets/uses/deploy-target/token
      - api_oidc_client_secret
      - api_db_password
      - caller_signing_key
    volumes:
      - caddy_data:/caddy-data:ro
    networks: [edge, internal]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: api
      io.github.racherom.modular-platform.module: api
    depends_on:
      db-init:
        condition: service_completed_successfully
      planner:
        condition: service_healthy
      deployer-docker:
        condition: service_healthy
      authelia:
        condition: service_healthy
      ingress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
      start_interval: 1s

  planner:
    image: ghcr.io/racherom/modular-platform/planner:0.0.0 # x-release-please-version
    restart: unless-stopped
    <<: *hardening
    user: "${PLATFORM_UID}:${PLATFORM_GID}"
    environment:
      MP_INSTANCE: planner
      MP_DOMAIN: modular-platform.internal
      MP_PLANNER_MODE: internal
      MP_PLANNER_CLIENTS_DIR: /run/secrets/clients/planner
      MP_CALLER_KEY_FILE: /run/secrets/caller_public_key
    secrets:
      - source: api_uses_planner
        target: /run/secrets/clients/planner/api
      - caller_public_key
    networks:
      internal:
        aliases: [planner.modular-platform.internal]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: planner
      io.github.racherom.modular-platform.module: planner
    healthcheck:
      test: ["CMD", "/planner", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  deployer-docker:
    image: ghcr.io/racherom/modular-platform/deployer-docker:0.0.0 # x-release-please-version
    restart: unless-stopped
    # root: it holds the Docker socket, which is root equivalent anyway (spec 0001)
    read_only: true
    tmpfs: [/tmp]
    environment:
      MP_INSTANCE: deployer-docker
      MP_DOMAIN: modular-platform.internal
      MP_DEPLOYMENTS_DIR: ${PLATFORM_DIR:?run setup.sh first}/deployments
      MP_PLATFORM_UID: ${PLATFORM_UID}
      MP_PLATFORM_GID: ${PLATFORM_GID}
      MP_PLATFORM_HTTP_PORT: ${PLATFORM_HTTP_PORT:-80}
      MP_PLATFORM_HTTPS_PORT: ${PLATFORM_HTTPS_PORT:-443}
      MP_DEPLOY_TARGET_CLIENTS_DIR: /run/secrets/clients/deploy-target
      MP_CALLER_KEY_FILE: /run/secrets/caller_public_key
    secrets:
      - source: api_uses_deploy-target
        target: /run/secrets/clients/deploy-target/api
      - caller_public_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # the same absolute path as on the host: the host daemon resolves the deployed projects' paths
      - ${PLATFORM_DIR}/deployments:${PLATFORM_DIR}/deployments
    networks:
      internal:
        aliases: [deployer-docker.modular-platform.internal]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: deployer-docker
      io.github.racherom.modular-platform.module: deployer-docker
    healthcheck:
      test: ["CMD", "/deployer-docker", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pg_data:/var/lib/postgresql
    networks: [internal]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: postgres
      io.github.racherom.modular-platform.module: postgres
    healthcheck:
      # -h 127.0.0.1: the first start's init server listens only on the socket
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  db-init:
    image: postgres:18.6-alpine3.24
    # creates the roles and databases of api and authelia when missing; runs on every up
    user: "${PLATFORM_UID}:${PLATFORM_GID}"
    <<: *hardening
    entrypoint: ["sh", "/db-init/init.sh"]
    secrets: [postgres_password, api_db_password, authelia_db_password]
    volumes:
      - ./db-init:/db-init:ro
    networks: [internal]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: db-init
      io.github.racherom.modular-platform.module: postgres
    depends_on:
      postgres:
        condition: service_healthy

  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    <<: *hardening
    # Authelia writes /app/.healthcheck.env at every start and stops when it cannot
    read_only: false
    user: "${PLATFORM_UID}:${PLATFORM_GID}"
    tmpfs: [/tmp]
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      PLATFORM_BASE_PATH: ${PLATFORM_BASE_PATH:-}
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /run/secrets/authelia_db_password
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/authelia_oidc_hmac
    secrets:
      - authelia_session_secret
      - authelia_storage_key
      - authelia_db_password
      - authelia_jwt_secret
      - authelia_oidc_hmac
      - authelia_oidc_key
      - authelia_client_digest
      - authelia_users
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
    networks: [edge, internal]
    labels:
      <<: *platform-labels
      io.github.racherom.modular-platform.instance: authelia
      io.github.racherom.modular-platform.module: authelia
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:9091${PLATFORM_BASE_PATH:-}/auth/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

networks:
  edge: {}
  internal:
    # no route out: only the services listed on it talk to each other
    internal: true

volumes:
  pg_data: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  api_uses_planner:
    file: ./secrets/api/uses_planner
  api_uses_deploy-target:
    file: ./secrets/api/uses_deploy-target
  api_oidc_client_secret:
    file: ./secrets/api/oidc_client_secret
  api_db_password:
    file: ./secrets/postgres/api_password
  caller_signing_key:
    file: ./secrets/api/caller_signing_key
  caller_public_key:
    file: ./secrets/api/caller_public_key
  postgres_password:
    file: ./secrets/postgres/password
  authelia_db_password:
    file: ./secrets/postgres/authelia_password
  authelia_session_secret:
    file: ./secrets/authelia/session_secret
  authelia_storage_key:
    file: ./secrets/authelia/storage_encryption_key
  authelia_jwt_secret:
    file: ./secrets/authelia/jwt_secret
  authelia_oidc_hmac:
    file: ./secrets/authelia/oidc_hmac_secret
  authelia_oidc_key:
    file: ./secrets/authelia/oidc_signing_key
  authelia_client_digest:
    file: ./secrets/authelia/api_client_digest
  authelia_users:
    file: ./secrets/authelia/users.yml
