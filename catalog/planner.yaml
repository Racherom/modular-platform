apiVersion: modular-platform/v0alpha1
kind: Module
name: planner
description: Checks a graph and renders it to a Compose project.
# release-please bumps the version on this line
image: ghcr.io/racherom/modular-platform/planner:0.0.0 # x-release-please-version
runtime: sdk
healthcheck:
  test: ["CMD", "/planner", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s
provides:
  planner:
    auth: binding-token
    env:
      clients_dir: MP_PLANNER_CLIENTS_DIR
config:
  planner-mode:
    env: MP_PLANNER_MODE
    type: enum
    values: [public, internal]
    description: Where the planner runs, public behind the online tool or internal inside the platform.
  planner-rate:
    env: MP_PLANNER_RATE
    type: int
    default: "60"
    min: 1
    description: Requests per minute per client address in public mode.
  proxy-hops:
    env: MP_PROXY_HOPS
    type: int
    default: "1"
    min: 0
    description: Proxies in front of the planner that append X-Forwarded-For.
  platform-http-port:
    env: MP_PLATFORM_HTTP_PORT
    type: int
    default: "80"
    min: 1
    max: 65535
    description: Host port of the platform's ingress for HTTP, which no deployed project may publish.
  platform-https-port:
    env: MP_PLATFORM_HTTPS_PORT
    type: int
    default: "443"
    min: 1
    max: 65535
    description: Host port of the platform's ingress for HTTPS, which no deployed project may publish.
