apiVersion: modular-platform/v1
kind: Capability
name: tls-certificate-provisioner
description: A certificate authority that issues a server certificate per consumer.
scheme: https
fields:
  url: {type: url, description: URL of the certificate authority.}
  provisioner: {type: string, description: Name of the authority's provisioner for jobs.}
  password: {type: secret, description: Password of that provisioner.}
  ca: {type: certificate, description: Root CA of the authority.}
yields:
  capability: tls-certificate
  fields:
    cert: output
    key: output
    ca: {admin: ca}
  job:
    image: smallstep/step-cli:0.30.2
    # Spec 0014, "Certificate provisioner". step certificate needs-renewal exits 0 when the
    # certificate needs renewing, 1 when it does not and 2 or 255 on an error, so only 1 keeps it.
    # /dev/shm is writable under read_only; the pair reaches /out only after the authority issued
    # it, and is written in place so the consumer's mount sees it (a reload loads it).
    provision: |
      if [ -s /out/cert ]; then
        rc=0
        step certificate needs-renewal /out/cert --expires-in 720h || rc=$?
        if [ "$rc" -eq 1 ]; then
          echo "certificate for $MP_CONSUMER_HOST has more than 30 days left: kept"
          exit 0
        fi
      fi
      echo "certificate for $MP_CONSUMER_HOST from $MP_ADMIN_URL"
      umask 077
      export STEPPATH=/dev/shm/step
      step ca certificate "$MP_CONSUMER_HOST" /dev/shm/cert /dev/shm/key --force \
        --ca-url "$MP_ADMIN_URL" --root "$MP_ADMIN_CA_FILE" \
        --provisioner "$MP_ADMIN_PROVISIONER" --provisioner-password-file "$MP_ADMIN_PASSWORD_FILE" \
        --not-after 2160h
      cat /dev/shm/key > /out/key
      cat /dev/shm/cert > /out/cert
      rm -f /dev/shm/cert /dev/shm/key
