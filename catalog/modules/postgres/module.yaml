apiVersion: modular-platform/v1
kind: Module
name: postgres
description: PostgreSQL server, official image; creates a database and login per consumer, with TLS when its tls slot is bound.
image: postgres:18.6-alpine3.24
command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
provides:
  server:
    capability: postgresql-provisioner
    version: "18.6"
    port: 5432
    fields:
      host: {platform: host}
      port: {platform: port}
      url: {platform: url}
      admin_user: {value: postgres}
      admin_password: {secret: password}
      sslmode: {platform: tls, "on": verify-full, "off": disable}
      ca: {platform: ca}
uses:
  tls:
    # its certificate from a tls-certificate-provisioner (spec 0014); unbound, it serves plain
    capability: tls-certificate
    optional: true
    files:
      cert: /run/tls/server.crt
      key: /run/tls/server.key
secrets:
  - name: password
    env: POSTGRES_PASSWORD_FILE
    description: Superuser password.
templates:
  - file: postgresql.conf.tmpl
    path: /etc/postgresql/postgresql.conf
  - file: pg_hba.conf.tmpl
    path: /etc/postgresql/pg_hba.conf
volumes:
  data: /var/lib/postgresql
hardening:
  tmpfs: [/var/run/postgresql, /tmp]
healthcheck:
  # -h 127.0.0.1: the image's first start init server listens only on the local socket,
  # so a socket check would pass before the real server is up
  test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s
