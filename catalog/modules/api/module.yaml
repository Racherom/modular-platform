apiVersion: modular-platform/v1
kind: Module
name: api
description: The managed platform's control plane, with sign in, deployments and their history.
# release-please bumps the version on this line
image: ghcr.io/racherom/modular-platform/api:0.0.0 # x-release-please-version
runtime: sdk
healthcheck:
  test: ["CMD", "/api", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 60s
provides:
  api:
    capability: platform-api
    version: "1.0"
    fields:
      url: {platform: url}
      ca: {platform: ca}
uses:
  public:
    capability: http-ingress
    env:
      origin: MP_PUBLIC_ORIGIN
      base_path: MP_BASE_PATH
    fields:
      route: {value: /api}
      upstream: {platform: url, provide: api}
      server_name: {platform: host, provide: api}
      # the event stream
      stream: {value: "true"}
  oidc:
    capability: oidc
    env:
      issuer: MP_OIDC_ISSUER
      client_id: MP_OIDC_CLIENT_ID
      client_secret: MP_OIDC_CLIENT_SECRET_FILE
      ca: MP_OIDC_CA_FILE
      admin_email: MP_ADMIN_EMAIL
    fields:
      redirect_path: {value: /api/v1/auth/callback}
  main-db:
    capability: postgresql
    client: postgresql
    env:
      url: MP_DATABASE_URL
      database: MP_DATABASE_NAME
      user: MP_DATABASE_USER
      password: MP_DATABASE_PASSWORD_FILE
      sslmode: MP_DATABASE_SSLMODE
      ca: MP_DATABASE_CA_FILE
  planner:
    capability: planner
    client: http
    env:
      url: MP_PLANNER_URL
      token: MP_PLANNER_TOKEN_FILE
      ca: MP_PLANNER_CA_FILE
    fields:
      caller_key: {secret: caller-public-key}
  deploy-target:
    capability: deploy-target
    client: http
    env:
      url: MP_DEPLOY_TARGET_URL
      token: MP_DEPLOY_TARGET_TOKEN_FILE
      ca: MP_DEPLOY_TARGET_CA_FILE
    fields:
      caller_key: {secret: caller-public-key}
secrets:
  - name: caller-signing-key
    from: setup
    env: MP_CALLER_SIGNING_KEY_FILE
    description: Private key api signs MP-Caller tokens with.
  - name: caller-public-key
    from: setup
    mount: /run/secrets/caller-public-key
    description: Public key of the caller signing key, sent to planner and deployer-docker.
setup:
  # the image has no shell, so the api binary writes the pair itself
  - name: caller-key
    command: [caller-key, generate]
    writes:
      - {name: caller-signing-key}
      - {name: caller-public-key, mode: "0644"}
config:
  proxy-hops:
    env: MP_PROXY_HOPS
    type: int
    default: "1"
    min: 0
    description: Proxies in front of api that append X-Forwarded-For.
  session-idle:
    env: MP_SESSION_IDLE
    type: duration
    default: 1h
    min: 5m
    max: 24h
    description: A session ends after this long without a request.
  session-max:
    env: MP_SESSION_MAX
    type: duration
    default: 12h
    min: 5m
    max: 720h
    description: A session ends this long after sign in, whatever its activity.
