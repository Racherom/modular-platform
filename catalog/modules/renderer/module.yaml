apiVersion: modular-platform/v1
kind: Module
name: renderer
description: Checks a graph and renders it to a Compose project.
# release-please bumps the version on this line
image: ghcr.io/racherom/modular-platform/renderer:0.0.0 # x-release-please-version
runtime: sdk
healthcheck:
  test: ["CMD", "/renderer", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s
uses:
  ingress:
    capability: http-ingress
    optional: true
    env:
      http_port: MP_PLATFORM_HTTP_PORT
      https_port: MP_PLATFORM_HTTPS_PORT
provides:
  renderer:
    capability: renderer
    version: "1.0"
    auth: binding-token
    fields:
      url: {platform: url}
      token: {generate: true}
      ca: {platform: ca}
    env:
      token: MP_RENDERER_CLIENTS_DIR
      caller_key: MP_CALLER_KEYS_DIR
config:
  renderer-mode:
    env: MP_RENDERER_MODE
    type: enum
    values: [public, internal]
    description: Where the renderer runs, public behind the online editor or internal inside the platform.
  renderer-rate:
    env: MP_RENDERER_RATE
    type: int
    default: "60"
    min: 1
    description: Requests per minute per client address in public mode.
  proxy-hops:
    env: MP_PROXY_HOPS
    type: int
    default: "1"
    min: 0
    description: Proxies in front of the renderer that append X-Forwarded-For.
