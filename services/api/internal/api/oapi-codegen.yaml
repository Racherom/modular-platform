# Models and the strict server on net/http, in one package: only api uses them. The
# shared kernel types (Graph, PlanResult, ProblemList) come from libs/contract.
package: api
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  prefer-skip-optional-pointer: true
  prefer-skip-optional-pointer-with-omitzero: true
  # keep the schemas only the plain handlers use (events, logout)
  skip-prune: true
  # plain handlers beside the strict server: the event stream never ends, the auth routes set cookies
  exclude-operation-ids: [events, login, callback, logout]
import-mapping:
  ./renderer.yaml: github.com/racherom/modular-platform/libs/contract
output: api.gen.go
